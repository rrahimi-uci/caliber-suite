[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "caliber-sdk"
version = "0.1.0.dev0"
description = "Typed Python client for the CALIBER management API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CALIBER" }]
keywords = ["caliber", "mlflow", "llmops", "agents", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

# Deliberately tiny. The whole point of a separate distribution is that a
# developer script does not drag in mlflow, sqlalchemy, and starlette to make an
# HTTP call. A dependency added here should be justified against that.
dependencies = [
    "httpx>=0.27,<1",
    "typing-extensions>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/rrahimi-uci/caliber-suite"
Documentation = "https://rrahimi-uci.github.io/caliber-suite/"
Source = "https://github.com/rrahimi-uci/caliber-suite/tree/main/sdk/caliber-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/caliber_sdk"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

# Own lint/type config rather than inheriting the server's by accident of
# layout -- the reason this package sits at the repository root instead of
# inside caliber/.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests"]
