# Coverage allowlist for the SDK<->API parity gate.
#
# Read by caliber/tests/test_sdk_api_coverage.py, which enumerates every
# operation the live server serves (via caliber.routes.openapi.build_openapi_document)
# and requires each one to be either:
#
#   1. reachable through a typed caliber-sdk method (verified by scanning
#      sdk/caliber-sdk/src/caliber_sdk/{resources/*.py,client.py} -- see
#      docs-site/sdk_coverage.py, the single shared implementation both this
#      gate and the published REST-inventory coverage table use), or
#   2. listed below, under [[exclusion]] (permanent -- never SDK scope) or
#      [[gap]] (temporary -- tracked, owned by a wave in sdk-completeness-plan.md).
#
# The gate fails in BOTH directions:
#   * a live operation with no SDK method and no entry here -- new, untracked drift.
#   * a [[gap]] entry the SDK now covers, or one naming a path the server no
#     longer serves -- stale bookkeeping that must be deleted, not left behind.
#
# Phase 3 (sdk-completeness-plan.md) is complete: every wave (3a-3e) closed,
# zero [[gap]] entries remain. Addressable coverage is 380/380 (100%). Only
# the permanent [[exclusion]] entries below are left -- a future PR that adds
# a brand-new server operation without SDK coverage will fail this gate and
# must either add the method or justify a new exclusion here.

[[exclusion]]
method = "GET"
path = "/csrf"
reason = "Handled internally by Transport.bootstrap_csrf(); a resource method would duplicate it."

[[exclusion]]
method = "POST"
path = "/auth/login"
reason = "Browser cookie session. The SDK authenticates with tokens by design (README); cookie auth is deliberately not modelled."

[[exclusion]]
method = "POST"
path = "/auth/logout"
reason = "Browser cookie session. The SDK authenticates with tokens by design (README); cookie auth is deliberately not modelled."

[[exclusion]]
method = "GET"
path = "/observability/allure-report"
reason = "Static HTML report proxy, not a JSON API operation."

[[exclusion]]
method = "GET"
path = "/observability/allure-report/{}"
reason = "Static HTML report proxy, not a JSON API operation."

[[exclusion]]
method = "GET"
path = "/metrics"
reason = "Prometheus text exposition, not JSON -- belongs to a scraper, not a client."
