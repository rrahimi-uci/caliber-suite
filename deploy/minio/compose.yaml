# MinIO — S3-compatible object storage for the CALIBER suite.
#
# Backs MLflow artifacts, CALIBER workflow/run files (Object Store), and the
# S3 log sink. The one-shot `createbuckets` job provisions the buckets the apps
# expect so a fresh `docker compose up` is immediately usable.
#
# Run on its own:   docker compose -f deploy/minio/compose.yaml up -d
# Or via umbrella:  docker compose -f deploy/compose.yaml up -d   (see deploy/README.md)

name: caliber-minio

services:
  minio:
    # Upstream's `minio/minio` (Docker Hub) and `quay.io/minio/minio` images are no
    # longer published, so `docker pull` fails with "pull access denied". Chainguard
    # publishes a maintained build of the same server under a free `latest` tag.
    image: cgr.dev/chainguard/minio:latest
    container_name: caliber-minio
    # Run as root, as the old upstream image did. The Chainguard default (uid 65532)
    # cannot write a `caliber_minio_data` volume created by that image, which would
    # break every existing checkout with "file access denied".
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"       # S3 API (loopback-only dev stack)
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"   # web console (loopback-only)
    volumes:
      - caliber_minio_data:/data
    restart: unless-stopped

  # One-shot init: create the buckets the apps expect, then exit 0. `--ignore-existing`
  # makes re-runs idempotent. The Chainguard client image has no shell, so there is no
  # wait loop: the alias comes from MC_HOST_local (no `mc alias set` step) and
  # `restart: on-failure` retries `mc mb` until MinIO accepts connections.
  # NOTE: MC_HOST_local embeds the credentials in a URL, so a MINIO_ROOT_PASSWORD with
  # URL-reserved characters (@ : / ? #) must be percent-encoded.
  createbuckets:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: caliber-minio-init
    depends_on:
      - minio
    restart: on-failure:60
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@minio:9000
    command:
      - mb
      - --ignore-existing
      - local/${MINIO_MLFLOW_BUCKET:-mlflow}
      - local/${MINIO_WORKSPACES_BUCKET:-caliber-workspaces}
      - local/${MINIO_LOG_BUCKET:-caliber-log}

volumes:
  caliber_minio_data:
