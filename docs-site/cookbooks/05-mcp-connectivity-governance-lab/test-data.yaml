# The cases live in assets/dataset/; this file names what each file is for.
golden_cases:
  - id: S01
    tool: search_repositories
    input: {query: "language:python"}
    expected: {total_count: 8}
  - id: L03
    tool: list_issues
    input: {repo: "acme/ledger-core", state: "open"}
    expected: {title: "Flaky test: test_ledger_reconcile"}
edge_cases:
  - id: S11
    tool: search_repositories
    input: {query: "legacy archived:false"}
    expected: {total_count: 0}
  - id: S12
    tool: search_repositories
    input: {query: "language:python", per_page: 3}
    expected: {total_count: 8}   # paging does not change the total
negative_cases:
  - id: F02
    tool: create_release
    expected_error: "is blocked by policy"
  - id: F03
    tool: drop_database
    expected_error: "not found on this server"
  - id: F05
    tool: search_repositories
    input: {query: "stars:>>not-a-number"}
    expected_error: "stars: expects a number"
datasets:
  calibration: assets/dataset/calibration-cases.jsonl
  classification: assets/dataset/tool-classification.jsonl
  invoke_checks: assets/dataset/invoke-checks.jsonl
