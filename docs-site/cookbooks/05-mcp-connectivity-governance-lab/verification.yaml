# Verified — see ../FEASIBILITY.md.
feasibility:
  - PolicyCorrectness is a DETERMINISTIC enforcement check (a blocked tool refuses to invoke; assert via the tool calibration panel), not an LLM judge.
  - MCP invokes that execute emit one MLflow TOOL span (mcp.<server>.<tool>) from the gateway; test-connection, discovery, policy changes and a blocked refusal emit none. The blocked refusal is only visible in the invoke-tool API response (the Playground disables Invoke for a blocked tool); Playground History is in-memory browser state.
evaluation:
  deterministic_checks:
    - name: PolicyCorrectness
      type: deterministic_scorer  # policy-enforcement assertion, not an LLM judge
      criteria: blocked/approval-required rules enforced
  rule_checks:
    - discovery_schema_present
    - policy_block_visible_and_enforced
quality_gates:
  connection_success_rate: 1.0
  blocked_tool_enforcement: 1.0
  at_least_one_read_tool_calibrated: true
monitoring:
  # An executed invoke emits a TOOL span (mcp.<server>.<tool>) visible in Observability;
  # test/discovery/policy paths and a blocked refusal emit none. Evidence:
  evidence:
    - playground_invocation_history  # in-memory per-invoke rows for executed invokes (read = success:true)
    - blocked_invoke_api_response    # success:false, error "MCP tool '<name>' is blocked by policy" from POST invoke-tool
    - tool_blocked_badge             # red "Blocked" badge + disabled Invoke button on the issue_write tool
    - calibration_verdicts           # saved per-case pass/fail + pass_rate on the read tool
  metrics:
    - discovery_tool_count
    - policy_block_count
feedback_loop:
  - add a saved case for every production-relevant discovered tool.
  - block workflow binding until direct invoke is stable.
