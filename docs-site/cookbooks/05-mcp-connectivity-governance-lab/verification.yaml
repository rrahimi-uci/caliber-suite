# Verified by running the lab against a real stack -- see README.md ("Verify it worked").
feasibility:
  - Enforcement is deterministic and proved from the MCP server's own ledger (assets/server/repo_tracker_mcp.py --ledger): a refused call writes no line. No model grades anything.
  - Calibration is an assertion check (no_error, output_contains, equals) over saved cases, not an LLM judge.
evaluation:
  deterministic_checks:
    - name: ClassificationBeforeUse
      type: deterministic_check
      criteria: every discovered tool starts unclassified and denied; an unclassified call is refused
    - name: RefusalsNeverRun
      type: deterministic_check
      criteria: blocked, unknown and rate-limited calls leave no ledger line and no trace
    - name: ApprovalGateHolds
      type: deterministic_check
      criteria: the workflow's write does not execute before a second person approves and the run is resumed
  rule_checks:
    - discovery_schema_present
    - write_tool_requires_approval
quality_gates:
  tools_discovered: 6
  calibration:
    search_repositories: "16/16"
    list_issues: "8/8"
    get_issue: "4/4"
  blocked_tool_executions: 0
  wrong_expectation_fails_exactly_one_case: true
monitoring:
  # A call that passes policy leaves one TOOL span named mcp.<server>.<tool> (input, output, latency,
  # status). Refusals, test-connection, discovery and policy changes leave none; a call made inside a
  # workflow run is the same span nested in the run's trace.
  evidence:
    - server_ledger          # the MCP server's own record of what ran
    - invoke_tool_response   # success false + error for each refusal
    - server_history         # create, policy and calibration actions
    - audit_log
    - mcp_traces
  metrics:
    - discovery_tool_count
    - calibration_pass_rate
feedback_loop:
  - add a saved case for every production-relevant read tool.
  - never bind a tool in a workflow until its classification and a calibration run are saved.
