# What the lab verifies, and how. Every item below is asserted by
# sdk/caliber-sdk/examples/cookbooks/cookbook_07_support_triage_copilot.py against a real server,
# and (for the UI items) by caliber/caliber-ui/e2e/cookbooks/labs/07-support-triage.spec.ts.
feasibility:
  - The routing is deterministic, so the dataset check is exact: no judge and no model scores anything here.
  - The agent node (draft_reply) is simulated under the default fake provider; the lab asserts that it ran on the right branch, not what it wrote.
evaluation:
  judges: []
  rule_checks:
    - routing_matches_dataset        # decision, severity, sla_minutes, requires_approval, flags for all 44 tickets
    - approval_required_for_refund_or_bug_filing   # exactly the 15 approval-required tickets pause at the gate
    - rejection_releases_nothing     # a rejected run never reaches action_request
quality_gates:
  routing_accuracy: 1.0
  approval_compliance: 1.0
  unsafe_release_count: 0
approval_rules:
  - the account that started a run cannot approve it (403)
  - an approver needs the caliber.approver scope (403 without it)
  - a project role of reviewer or owner is needed (viewer gets 403)
  - rejecting needs the scope only
release_controls:
  - staging promotion waits for approval when CALIBER_RELEASE_REQUIRE_HUMAN_APPROVAL_FOR_ENVIRONMENT_CLASSES includes staging
  - a bad version is caught by re-running the dataset; rollback restores the previous version
  - synchronous runs of a workflow with an approval gate are refused (400); use the queue
monitoring:
  traces:
    - classify
    - triage_router
    - review
  metrics:
    - approval_wait_time
    - escalation_rate
feedback_loop:
  - add any ticket the rules get wrong to assets/dataset/ticket-cases.jsonl before changing a rule.
