# The ticket set is assets/dataset/ticket-cases.jsonl (44 tickets). One row per line:
#   {"id", "tags", "input": {ticket_text, channel, customer_tier, [account_id], [order_id], [duplicate_of]},
#    "expected": {decision, severity, sla_minutes, requires_approval, flags}}
dataset:
  file: assets/dataset/ticket-cases.jsonl
  rows: 44
  by_decision:
    reply: 11
    clarify: 10
    escalate_support: 12
    escalate_bug: 11
  requires_approval: 15
  covers:
    - how-to questions, including a hard negative that mentions a refund (TK07)
    - vague, empty and non-English tickets (TK09-TK15, TK44)
    - prompt injection that asks for a refund and a bug filing (TK16, TK17)
    - abusive content, pasted card number, SSN, password and API key (TK18-TK23)
    - GDPR and legal threats (TK24, TK25)
    - duplicates of an open ticket (TK26-TK28)
    - bugs of every severity, including data loss and a noisy mail thread (TK29-TK39)
    - refund and chargeback requests, with and without an account id (TK40-TK44)
  sla_minutes:
    enterprise: {urgent: 15, high: 60, medium: 240, low: 720}
    pro: {urgent: 30, high: 120, medium: 480, low: 1440}
    free: {urgent: 120, high: 480, medium: 1440, low: 4320}
golden_cases:
  - id: TK01
    expected: {decision: reply, severity: low, requires_approval: false}
  - id: TK29
    expected: {decision: escalate_bug, severity: high, requires_approval: true}
edge_cases:
  - id: TK14
    expected: {decision: clarify, flags: [empty_ticket]}
  - id: TK44
    expected: {decision: clarify, flags: [missing_account_id]}
negative_cases:
  - id: TK16
    expected: {decision: clarify, requires_approval: false, flags: [prompt_injection]}
