workflow_goal: Turn inbound support tickets into a routing decision with SLA, and gate refunds and bug filings behind a second person.
# Everything below was run against a real server (scripts/cookbook-env.sh); see README.md and
# sdk/caliber-sdk/examples/cookbooks/cookbook_07_support_triage_copilot.py.
feasibility:
  - The classifier is deterministic rules in one Python Code node (no model). A real model would replace or sit beside it; the router, the gate and the dataset check do not change.
  - Preview cannot isolate a Python Code node, so this workflow is run through the queue, not previewed.
  - Evidence tools, the knowledge base and the GitHub MCP write are not part of the verified path (no connector and no model on the lab machine). The action_request template stands in for the external write.
manual_flow:
  - step: import
    action: import assets/workflows/support-triage.workflow.json (Workflows > Import, or POST /workflows/import)
  - step: validate
    action: "validate the manifest (Preview is refused: python_code)"
  - step: publish
    action: publish version 1
  - step: promote
    action: move the staging alias onto it (waits for a second person when the server requires approval for staging)
  - step: run
    action: run the 44 tickets of assets/dataset/ticket-cases.jsonl through the queue against the alias
  - step: approve
    action: a second person with caliber.approver approves or rejects the paused runs
components:
  workflow:
    file: assets/workflows/support-triage.workflow.json
    code_node_source: assets/workflows/classify-ticket.py
    nodes:
      - start             # the ticket, as JSON text
      - classify          # python_code: rules -> decision, severity, sla_minutes, requires_approval, flags
      - triage_router     # router: approval == true -> review; else by decision
      - draft_reply       # agent (simulated under the fake provider)
      - clarify_question  # template
      - support_note      # template
      - review            # human_approval (caliber.approver, one approver, no self-approval)
      - action_request    # template: what an approved refund / bug issue would release
      - final             # output
contracts:
  input_schema:
    type: object
    required: [ticket_text]
    properties:
      ticket_text: {type: string}
      channel: {type: string}
      customer_tier: {type: string, enum: [free, pro, enterprise]}
      account_id: {type: string}
      duplicate_of: {type: string}
  triage_record:
    type: object
    required: [decision, severity, sla_minutes, requires_approval, flags]
    properties:
      decision: {type: string, enum: [reply, clarify, escalate_support, escalate_bug]}
      severity: {type: string, enum: [low, medium, high, urgent]}
      sla_minutes: {type: integer}
      requires_approval: {type: boolean}
      flags: {type: array}
rule_order:
  - empty ticket -> clarify
  - prompt injection -> clarify (flag prompt_injection)
  - abusive -> escalate_support, medium (flag abusive)
  - card number / SSN / pasted secret -> escalate_support, high (flag pii_exposed)
  - legal or privacy -> escalate_support, high (flag legal_or_privacy)
  - duplicate_of present -> reply (flag duplicate)
  - bug markers -> escalate_bug, approval required
  - refund or charge dispute with an account id -> escalate_support, approval required (flag refund_request); without one -> clarify (flag missing_account_id)
  - how-to -> reply
  - anything else -> clarify
failure_modes:
  - missing_account_identifier
  - prompt_injection_asks_for_refund
  - bug_issue_released_without_approval
fallbacks:
  - clarify instead of guessing.
  - a rejected approval ends the run failed and releases nothing.
