id: SCN-07
slug: support-triage-resolution-loop
name: "Support Triage Copilot"
track: build
objective: Run a support triage workflow end to end - classify a ticket, route it to reply, clarify, escalate or an approval-gated action, run it through the queue over a realistic ticket set, and prove the approval, promotion and rollback controls.
why_it_matters:
  - Shows a workflow that decides, pauses for a human, resumes, and can be rolled back, with every step recorded.
  - Creates a strong operator audit trail for customer-impacting decisions.
primary_persona: support engineer
secondary_personas:
  - AI engineer
  - platform engineer
caliber_surfaces:
  - Workflows
  - Test Sets
  - Projects and roles
  - Cookbooks
  - Audit Log
prerequisites:
  - CALIBER_FEATURE_COOKBOOKS=true.
  - A second account holding caliber.approver (the lab creates lena and sam).
time_to_first_value: 30-45 minutes
success_criteria:
  - All 44 tickets route to the expected decision, severity, SLA and approval requirement.
  - The approval gate holds: self-approval refused, a second approver releases, a rejection releases nothing.
  - A bad version is caught by the dataset and rolled back.
demo_profile:
  recommended_sequence_index: 7
  tier: build
  live_demo_minutes: 45-70
  depends_on: []
  included_in:
    - end_to_end
    - release_governance
  showcase_capabilities:
    - approval-gated customer-impacting actions
    - dataset-checked routing with rollback
