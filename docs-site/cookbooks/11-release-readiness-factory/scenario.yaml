id: SCN-11
slug: release-readiness-factory
name: "Release Signoff Factory"
track: gate
objective: "Record an accountable go/no-go decision for a release: weighted criteria scored by the server, blockers, waivers with an owner and an expiry, a report snapshot, and an immutable signoff. The record deploys nothing."
why_it_matters:
  - A decision with no record is a decision nobody can audit.
  - A waiver is an exception someone owns, with a reason and an expiry; it is not a way to raise a score.
  - Signing off is not releasing, and the lab shows both.
primary_persona: release manager
secondary_personas:
  - platform engineer
  - evaluator
caliber_surfaces:
  - Releases
  - Audit Log
prerequisites:
  - CALIBER_FEATURE_RELEASE_CANDIDATES=true (preview area, off by default).
  - An operator account (CALIBER_OPERATOR_USERS) to create candidates and an admin to waive and sign off.
  - Scores and evidence references to enter; CALIBER does not read them from Evaluations or check them.
time_to_first_value: 20-40 minutes
success_criteria:
  - The server's weighted score, status and blockers match the dataset for all 20 candidates (14 ready, 6 blocked).
  - A waiver clears a blocker but not a low score.
  - A signed candidate cannot be evaluated, waived or signed again.
  - After a signed GO the artifact's aliases, the live board and the timeline are unchanged.
demo_profile:
  recommended_sequence_index: 11
  tier: gate
  live_demo_minutes: 20-35
  depends_on: []
  included_in:
    - release_governance
  showcase_capabilities:
    - server-computed readiness and blockers
    - accountable waivers and immutable signoff (record-only)
