# Verified by running the lab against a real stack -- see README.md ("Verify it worked").
feasibility:
  - The figures are computed by the server and checked against expectations worked out independently with exact fractions (assets/dataset/release-candidates.jsonl, "expect"); caliber/tests/test_cookbook_11_release_signoff_lab.py runs every row through the server's own scoring.
  - Nothing here is judged by a model. The criteria scores are inputs.
evaluation:
  deterministic_checks:
    - name: ScoreAndBlockersMatch
      type: deterministic_check
      criteria: weighted_score, status and blockers equal the dataset's expectation for all 20 candidates
    - name: WaiverIsNotAScore
      type: deterministic_check
      criteria: a waiver clears a blocker and leaves the weighted score unchanged
    - name: SignedIsFinal
      type: deterministic_check
      criteria: evaluate, waive and a second signoff on a signed candidate answer 409
    - name: SignoffDeploysNothing
      type: deterministic_check
      criteria: prompt aliases, the live board and the timeline are unchanged by a signed GO
  rule_checks:
    - go_requires_ready_planned_action_and_rollback_target
    - waiver_requires_admin_reason_existing_key_and_future_expiry
    - ui_card_names_blockers_waivers_and_score_shortfall   # UI only: each card says which criterion blocks it, who waived what until when, and when the score alone blocks
    - ui_new_candidate_for_the_next_version            # UI only: a candidate is never edited; the fixed package version gets a new ready candidate
    - ui_signoff_deploys_nothing                       # UI only: after a signed GO the live board and timeline are unchanged; Make live on the prompt moves them
quality_gates:
  candidates_created: 20
  ready: 14
  blocked: 6
  go_on_blocked_candidate: refused
  change_after_signoff: refused
monitoring:
  evidence:
    - "candidate_record      # GET /releases/candidates/{id}: candidate, signoffs, report_jobs"
    - report_job            # candidate_snapshot_sha256
    - audit_log
  metrics:
    - weighted_score
    - blocker_count
feedback_loop:
  - map each blocker to its owner and reopen that gate; do not waive to ship.
  - write the waiver's expiry and compensating control into the reason (the form has no expiry field).
