# Verified — see ../FEASIBILITY.md.
feasibility:
  - The release score and blockers are computed by the server from the criteria you enter on Releases (weighted_score = sum(weight x score) / sum(weight); blocking criteria below threshold and not waived are blockers). The release_rubric below is the criteria set to enter, not a hand calculation.
  - allure_report_generated is real (Releases -> Generate Allure creates a durable Allure-compatible JSON report job); the static Allure HTML at Settings -> Allure Report (GET /observability/allure-report) is separate CI evidence produced by the test tooling.
  - monitoring.traces below are evidence labels, not literal span names.
evaluation:
  release_rubric:
    component_readiness: 0.30
    workflow_readiness: 0.30
    review_coverage: 0.20
    evidence_visibility: 0.20
  rule_checks:
    - allure_report_job_generated
    - required_scenario_evidence_present
quality_gates:
  overall_release_score_min: 0.90
  blocker_count_must_equal: 0
  allure_report_job_required: true
monitoring:
  traces:
    - release_summary_generation
    - blocker_review
    - allure_report_job
  metrics:
    - release_score
    - blocker_count
    - unresolved_review_count
feedback_loop:
  - map each blocker to the owning scenario and reopen that scenario gate.
  - keep waiver log with the owner and the expiry written into the waiver reason (the UI has no expiry field).
