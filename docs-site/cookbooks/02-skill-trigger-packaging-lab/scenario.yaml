id: SCN-02
slug: skill-trigger-packaging-lab
name: "Precision Skills"
track: starter
objective: Build one skill whose trigger behaviour is measured on 40 cases, calibrate it, apply and roll back a candidate, and package it.
why_it_matters:
  - Prevents over-broad skill activation in production assistants.
  - Shows exactly what a skill package does and does not carry.
primary_persona: AI engineer
secondary_personas:
  - developer
  - evaluator
caliber_surfaces:
  - Skills
  - Cookbooks
  - Administration
prerequisites:
  - Skill workspace access.
  - Queries for positive and negative trigger testing.
time_to_first_value: 45-75 minutes
success_criteria:
  - Trigger accuracy is at least 0.95 on the 40-case set (40 of 40 after tightening).
  - Apply and rollback move the skill forward through versions 2 and 3.
  - A package round trip keeps the instructions; the selection metadata is restored deliberately.
demo_profile:
  recommended_sequence_index: 2
  tier: foundation
  live_demo_minutes: 25-40
  depends_on:
    - SCN-01
  included_in:
    - end_to_end
    - release_governance
  showcase_capabilities:
    - deterministic skill triggering
    - package export and import, with its limits stated
