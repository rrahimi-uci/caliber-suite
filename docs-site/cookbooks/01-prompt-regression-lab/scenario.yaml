id: SCN-01
slug: prompt-regression-lab
name: "Trustworthy Intake Classifier"
track: starter
objective: Build a prompt-only classifier that converts free text into stable JSON labels before any tools or workflows are introduced.
why_it_matters:
  - Localizes instruction failures without tool or retrieval noise.
  - Produces a reusable prompt baseline for later workflow binding.
primary_persona: developer
secondary_personas:
  - AI engineer
  - evaluator
caliber_surfaces:
  - Prompts
  - Test Sets
  - Evaluations
  - Releases
  - Audit Log
prerequisites:
  - CALIBER running per docs/start/alpha-install.md with CALIBER_FEATURE_COOKBOOKS=true (no other flag).
  - A model provider only to score a prompt on the Evaluations page and to get real calibration evidence; the lab also runs end to end on the simulated defaults, and on a real model (verified with a local Ollama qwen2.5:7b; a hosted provider is the same command without the base-URL overrides and was not run).
  - The labelled ticket set in assets/dataset/intake-classifier.jsonl (44 cases).
time_to_first_value: 30-60 minutes
success_criteria:
  - The test set imports from the file (44 examples) through the API and through the UI.
  - With a model that answers, both prompt versions are scored on all 44 cases and compared (the deterministic stand-in gives v1 44/44 strict JSON, v2 0/44 and a failed gate; a real 7B model keeps both at 44/44 JSON and the scorecard still drops); on a simulated model the evaluation is refused and the evidence is marked simulated.
  - Calibration on a real model yields a candidate whose evidence is not marked simulated (44 examples, measured baseline and candidate scores) or an honest, reasoned rejection by the gate.
  - A calibrated candidate is reviewed, applied explicitly, verified in the MLflow registry, the live board, the release timeline and the audit log, then rolled back.
demo_profile:
  recommended_sequence_index: 1
  tier: foundation
  live_demo_minutes: 20-30
  depends_on: []
  included_in:
    - quick_reliability
    - end_to_end
    - release_governance
  showcase_capabilities:
    - prompt lifecycle (author, import a test set, evaluate, calibrate, review, apply, roll back)
    - regression visibility (Evaluations compare-to-baseline)
    - release evidence (live board, timeline, audit log)
