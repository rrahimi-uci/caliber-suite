workflow_goal: Deliver grounded policy answers from KB retrieval with explicit citation and abstention policy.
# Verified by running every step: see README.md.
feasibility:
  - KB Explore sub-views are Query/Chunks/Graph; retrieval modes dense/hybrid/graph_hybrid/age_graph (AGE only after a manual Sync to AGE; not used here).
  - KB creation needs an object store and the knowledge-local extra (503 with the reason otherwise); the first build needs the embedding model cached (HF_HUB_OFFLINE=1) or a reachable huggingface.co. Calibrate needs an existing Test Set (eval_dataset_id); POST /knowledge/query takes version_ids (1-3), not knowledge_base_id.
  - A finished build activates itself; an unreadable file is a failed source, not a failed build (a build with nothing readable fails); rollback needs an audited activation.
  - Simulated stack: the answer text is an extractive digest, Faithfulness/Answer-correctness are null, scoring a prompt is refused (400). Decisions (answer/abstain/clarify) need a real model.
  - Answer workflow = cookbook 06 (knowledge_rag): knowledge_query -> confidence (data_transform) -> output; send needs_review runs to a review queue with POST /review-queues/{id}/items.
manual_flow:
  - step: kb_build
    action: ingest corpus and build active KB version
  - step: retrieve
    action: run dense/hybrid/graph retrieval over scenario prompts
  - step: answer
    action: return the retrieved evidence with a citation per chunk (extractive on the simulated stack; a model writes the answer on a real one)
  - step: abstain_check
    action: gate on the best chunk's similarity and citations; a model decides abstain/clarify
  - step: evaluate
    action: calibrate retrieval (Recall@k, nDCG@k) and route low-confidence runs to a review queue
components:
  prompts:
    system: "Answer only from retrieved evidence and include citations."
    developer: "If evidence conflicts, present conflict and request clarification."
  workflow:
    template: knowledge_rag        # installed by cookbook 06
    nodes:
      - knowledge                # knowledge_query node (binds the knowledge base, resolves its active version)
      - confidence               # data_transform confidence node: citations + best-chunk score
      - final                    # output
contracts:
  input_schema:
    type: string                 # the question, as the workflow's start input (user_message)
  output_schema:
    type: object
    required: [response]
    properties:
      response: {type: string}   # the retrieved evidence, one cited chunk per entry (extractive on the simulated stack)
  confidence_result:
    required: [confidence, needs_review, review_threshold, matched_signals]
failure_modes:
  - missing_citations
  - contradictory_source_blending
  - hallucinated_policy_steps
fallbacks:
  - refuse (or send to review) when the best chunk's similarity is below the gate.
  - send needs_review runs, and every question a score gate cannot refuse, to a human review queue.
