id: SCN-06
slug: knowledge-retrieval-policy-qa-lab
name: "Grounded Knowledge Assistant"
track: build
objective: Build a grounded retrieval assistant over internal docs and policies with measurable faithfulness and abstention behavior.
why_it_matters:
  - Retrieval quality and answer quality fail in different ways and must be separated.
  - Policy assistants must cite sources or abstain.
primary_persona: AI engineer
secondary_personas:
  - compliance analyst
  - solution architect
caliber_surfaces:
  - Knowledge Bases
  - Prompts
  - Workflows
  - Evaluations
  - Review Queues
  - Observability
prerequisites:
  - An S3-compatible object store with credentials (CALIBER_OBJECT_STORE_ENDPOINT_URL and the two key sources).
  - "pip install caliber-suite[knowledge,knowledge-local] and the all-MiniLM-L6-v2 model cached (HF_HUB_OFFLINE=1 once cached)."
  - The 11 policy documents in assets/dataset/sources/.
time_to_first_value: 120-180 minutes
success_criteria:
  - The answer cites the chunk that holds the clause (41/41 answerable questions have it in the hybrid top 3).
  - Calibration raises Recall@1 (0.878 to 0.9268) and nDCG@1 (0.9024 to 0.9512); the model-judged metrics need a real provider (verified on one: faithfulness 0.96-0.99, answer correctness 0.71-0.98; hybrid 0.89 against dense 0.71 at top_k 1).
  - With a real provider the kb-answer prompt abstains on the questions the corpus does not cover, including the two traps the score gate cannot refuse, and asks to clarify on the conflicting-refund questions (48 of 48 decisions as labelled in the verified run).
  - A score gate refuses the questions outside the corpus; the trap questions need a model and a review queue.
demo_profile:
  recommended_sequence_index: 6
  tier: build
  live_demo_minutes: 40-60
  depends_on:
    - SCN-04
    - SCN-05
  included_in:
    - end_to_end
    - release_governance
  showcase_capabilities:
    - retrieval mode comparison (dense, hybrid, graph)
    - citation and abstention governance
