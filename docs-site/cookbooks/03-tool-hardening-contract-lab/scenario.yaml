id: SCN-03
slug: tool-hardening-contract-lab
name: "Policy-Safe Decision Tool"
track: starter
objective: Register a deterministic refund-policy tool, harden it against a 49-case fixture suite, then let a workflow issue the refund only after a second person approves.
why_it_matters:
  - Makes business policy executable, testable and auditable.
  - Keeps the side effect behind a human decision that the initiator cannot give themselves.
primary_persona: developer
secondary_personas:
  - AI engineer
  - platform engineer
caliber_surfaces:
  - Tools
  - Workflows
  - Administration
  - Audit Log
prerequisites:
  - A stack with runtime approvals, the workflow run queue and checkpointing on (the lab environment script does this).
  - Accounts approver1 (platform approver scope) and viewer1.
  - CALIBER_FEATURE_COOKBOOKS=true for the gallery starter only; the rest needs no flag.
time_to_first_value: 15-30 minutes
success_criteria:
  - All 49 fixtures pass (pass rate 1.0) and the run is pinned as the baseline.
  - A deliberately wrong fixture shows up as one regression against the baseline.
  - The refund node pauses; the initiator is refused; a second person approves; the refund fires only after Resume.
  - A rejected run never issues the refund; a denied decision finishes without any approval.
  - The audit log names the approver and the initiator.
demo_profile:
  recommended_sequence_index: 3
  tier: foundation
  live_demo_minutes: 20-30
  depends_on: []
  included_in:
    - quick_reliability
    - end_to_end
    - release_governance
  showcase_capabilities:
    - deterministic business logic contracts
    - baseline/regression hardening lanes
    - separation of duties on a write tool
