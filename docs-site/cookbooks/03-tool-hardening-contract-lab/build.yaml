workflow_goal: Decide a refund with a deterministic registered tool, then issue it only after a second person approves.
# Verified by running the lab against a live stack; see README.md.
feasibility:
  - A registered tool must be importable Python (module_path + callable_name) in the server's environment. This lab uses the shipped caliber.workflows.demo_tools module, which provides decide_refund (the policy) and initiate_refund (the write stub). To register your own, install your package into the server's environment first.
  - The sandbox runs a read tool live (in a subprocess) only with allow_in_preview=true; a write tool is mocked and never imported in preview.
  - POST /tools rejects a write or external_action tool without requires_approval=true (400). The wizard locks the toggle on for write.
  - The gate is the write tool's own requires_approval flag: a tool node bound to it stops at waiting_approval. The import preview still reports the advisory write_tool_without_approval warning because the workflow has no Human Approval node.
  - Approve needs the caliber.approver scope and, in a workspace, the reviewer/owner role; the run initiator is refused (403) unless CALIBER_APPROVAL_ALLOW_SELF_APPROVAL=true. Resume is a separate step that needs caliber.operator.
  - Fixtures use the assertion types no_error, output_contains and equals. A tool error fails every assertion, so malformed input must produce a deterministic output rather than raise.
  - Calibration (POST /tools/{id}/calibrate) runs inline, one subprocess per case (about 0.7 s each): 49 cases take about 35 s, longer than the SDK default timeout of 30 s.
manual_flow:
  - step: register_tools
    action: Register decide_refund (read, allow in preview) and initiate_refund (write, requires approval).
  - step: sandbox
    action: Run decide_refund live and see initiate_refund mocked.
  - step: fixtures
    action: Save the 49 fixture cases.
  - step: harden
    action: Run the suite, record it, pin the baseline, provoke and see a regression.
  - step: workflow
    action: Import the workflow, run it, approve as a second person, resume.
  - step: failures
    action: Reject a run, deny a decision, read the audit log.
components:
  tools:
    - decide_refund       # caliber.workflows.demo_tools:decide_refund (read, allow_in_preview)
    - initiate_refund     # caliber.workflows.demo_tools:initiate_refund (write, requires_approval)
  workflow:
    asset: assets/workflow/refund-decision.workflow.yaml
    nodes:
      - policy          # tool node: decide_refund
      - refund_request  # data_transform mapping: order_id and amount from the run input
      - route           # router: a deny decision goes to `denied`, everything else to `refund`
      - refund          # tool node: initiate_refund, held at waiting_approval
contracts:
  input_schema:
    type: object
    required: [order_state, amount, days_since_order]
  output_schema:
    type: object
    required: [decision, reason_code, requires_approval]
    properties:
      decision: {type: string, enum: [approve, deny, manual_review]}
      reason_code: {type: string}
      requires_approval: {type: boolean}
failure_modes:
  - write tool registered without requires_approval
  - viewer or approver without operator scope runs or calibrates a tool
  - initiator approves their own run
  - tool stalls past the sandbox deadline
fallbacks:
  - malformed or missing input fails closed to manual_review (INVALID_INPUT, MISSING_RISK_DATA, UNKNOWN_ORDER_STATE).
