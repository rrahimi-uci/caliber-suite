id: SCN-12
slug: aria-evaluation-harness
name: "Aria: Evaluation Harness from Intent"
track: aria
objective: Give Aria a single clear intent and have it plan and create a faithfulness judge plus a test set to run it on - end to end, with the judge's and the test set's fields entered in the plan's input forms and each change confirmed - then fill the test set with 30 support cases and see what Aria refuses.
why_it_matters:
  - Shows Aria turning one sentence into governed, real artifacts via plan -> approve -> execute, and exactly where its rules-based planner stops.
  - Establishes the autonomous-orchestration pattern, bounded honestly by Aria's real capability registry.
primary_persona: AI engineer
secondary_personas:
  - evaluator
  - platform engineer
caliber_surfaces:
  - Plans
  - Judges
  - Test Sets
  - Evaluations
prerequisites:
  - CALIBER_FEATURE_ARIA=true (Aria and its Plans page are a preview area, off by default). CALIBER_FEATURE_COOKBOOKS=true only for the gallery card.
  - Two extra accounts for the refusals: olga (an operator who does not own the plan) and vera (not an operator). The script creates them; the server must list olga in CALIBER_OPERATOR_USERS and not vera.
  - No model is needed to create the artifacts; a real model provider is needed only to run the judge in Evaluations (refused on the simulated default) and for the Ask Aria chat. A real tier is verified: scripts/cookbook-env.sh up lab12h --flags cookbooks,aria --real-llm with your own OPENAI_API_KEY (README, Run it with a real provider).
time_to_first_value: 15-30 minutes
success_criteria:
  - From the intent alone, Aria drafts a plan containing judge.create then eval_dataset.create, and the planner draws the documented plan for all 28 goals in assets/dataset/goals.jsonl.
  - After approval and answering the two input forms and the two approval prompts, a real active judge and a test set (with its own name) exist, and the test set takes the 30 cases.
  - The refusals hold: a plan with no steps cannot be approved, a bad form answer is refused and the question stays open, a failing step fails the plan with a readable reason, a role without the operator scope creates nothing.
demo_profile:
  recommended_sequence_index: 12
  tier: aria
  live_demo_minutes: 15-25
  depends_on: []
  included_in:
    - aria_autonomous
  showcase_capabilities:
    - Aria plan decompose -> approve -> execute
    - judge and test set created from a single intent
