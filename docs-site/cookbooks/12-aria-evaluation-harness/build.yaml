workflow_goal: From one clear intent, have Aria plan and create a faithfulness judge and a test set, collecting each step's fields through the plan's input forms, then load 30 cases into the test set.
# Verified against the Aria capability registry + plan executor - see ../ARIA-AUTONOMY.md.
feasibility:
  - Aria's capability registry today = judge.create, review_queue.create, eval_dataset.create, review_queue.add_items, workflow.calibrate (+ the read capabilities judge.list, review_queue.list, openapi_tool.list, openapi_tool.invoke). It cannot author prompts, skills, tools or workflows. This scenario lives entirely inside that set.
  - The default planner proposes a step for each non-read capability whose DOMAIN word appears in the goal (or a synonym such as "test set" for eval_dataset). It is rules, not a model: it does not read negation or questions and matches words inside other words.
  - INPUTS - the planner leaves unknown fields empty; when a step is about to run the executor raises an `input` interaction (UI - "Aria needs information", Continue plan / Skip step; API - POST /aria/interactions/{id}/answer {inputs}). The answer is merged into the step and validated against the capability schema (a bad one is a 409 and the question stays open), then the plan resumes. A planner only wires a field that points at an earlier step's result (a *_id); a name is always asked for.
  - autonomy ask_each adds an Approve/Deny prompt before each mutate step; approve_plan/auto_guarded run them straight after the input form.
  - eval_dataset.create makes the EMPTY test set; example rows are added separately (not an Aria capability).
manual_flow:
  - step: state_intent
    action: Open Operate > Plans, state the one-line intent and pick the autonomy.
  - step: review_plan
    action: Aria drafts a plan (judge.create then eval_dataset.create); read the steps.
  - step: approve
    action: Press Approve plan.
  - step: execute_and_answer
    action: Execute; fill the judge's form and the test set's form, press Continue plan; Approve each step under ask_each.
  - step: verify
    action: Confirm the judge is active (Judges) and the test set exists (Test Sets); add rows.
components:
  aria:
    intent: "Create a judge for answer faithfulness and an eval dataset to run it on."
    autonomy: ask_each
    capabilities:
      - judge.create          # TIER_MUTATE
      - eval_dataset.create   # TIER_MUTATE
    step_inputs_needed:
      - "judge.create: name, instructions (must reference {{ inputs }}/{{ outputs }}/{{ expectations }}/{{ conversation }}/{{ trace }}); optional feedback_value_type, description, model, tags"
      - "eval_dataset.create: name; optional description, tags"
  prompts: none
  skills: none
  tools: none
  mcp: none
  workflow: none
contracts:
  intent_schema:
    type: object
    required: [goal]
    properties:
      goal: {type: string}
      autonomy: {type: string}
  output_artifacts:
    type: object
    required: [judge_id, dataset_id]
failure_modes:
  - intent omits a domain word -> the planner skips that capability (or plans nothing, and the plan cannot be approved)
  - judge instructions reference no evaluation variable -> the form accepts it, judge.create fails the step and the plan
  - a name that is already taken -> the step fails the plan
  - the plan's owner lacks the operator scope -> the plan fails at execute and creates nothing
  - no model provider -> the judge cannot run in Evaluations (400)
fallbacks:
  - if an unwanted step is proposed, Deny / Skip step marks it skipped, or Cancel the draft.
  - a failed plan cannot be run again: state the goal again.
