workflow_goal: Take a workflow from failing in production to a proved patch and a reversible alias, without a model.
# Verified by running every step against a real server; see README.md and the script/spec named below.
feasibility:
  - Run Monitor, Recovery Diagnostics, Execution Debugger, Retry Lineage and the ERROR trace of a failed run are real. A node failure writes no checkpoint (only approvals and waits do), and the failing node is not a recorded step; Current node names it.
  - A retry runs the same version on the same input. It cannot fix a code fault.
  - POST /workflow-versions/{id}/propose-patch is API only, no page calls it, and it only knows agent-shaped fixes. For a Python node it returns a prompt suggestion with no graph change; a guardrail patch aimed at a code node is a 400.
  - Preview and deploy gates refuse workflows with python_code or api_request nodes, so the fix is proved with real runs of the dataset on the new version.
  - The alpha UI has one live alias (prod) and hides Deployments and Promotions. The staging alias, its rollback and the prod refusal are API; the UI's Promote shows the prod refusal.
manual_flow:
  - step: import
    action: import assets/workflow/ticket-intake.v1.workflow.yaml and publish it
  - step: reproduce
    action: run F12, F29 and F32 in the Run Monitor
  - step: localize
    action: read Recovery Diagnostics, the Execution Debugger and the ERROR span of the trace
  - step: retry
    action: Retry; the same node fails again (Attempt 2 of 2)
  - step: patch
    action: restore v1 as a draft, replace the code of validate, check_reference and decide with assets/workflow/patch/*.py, save and publish as v2
  - step: validate
    action: run the same tickets on v2, and compare the versions
components:
  prompts: {}
  skills: {}
  tools: {}
  workflow:
    nodes:
      - start
      - validate (python_code)
      - check_reference (python_code)
      - lookup (api_request to the stand-in account service)
      - decide (python_code)
      - final
    focus:
      - run debugger
      - retry lineage
      - versions
      - deployment aliases
contracts:
  input_schema:
    type: object
    description: A refund ticket as a JSON string (the run input).
    required: [ticket_id, account_id, amount, currency, reason, order_ref]
  output_schema:
    type: object
    description: The decision the final node returns (version 2 adds errors or upstream_status in two cases).
    required: [ticket_id, decision, reason_code]
failure_modes:
  - schema_violation_in_validate
  - catastrophic_backtracking_timeout_in_check_reference
  - upstream_error_crashing_decide
fallbacks:
  - reject an invalid ticket with its reasons instead of failing the run.
  - degrade to manual review when the account lookup fails.
golden_cases:
  - id: F01
    input: {payload: "healthy premium ticket"}
    expected: {decision: approve, reason_code: ELIGIBLE_AUTO_APPROVE}
edge_cases:
  - id: F29
    input: {payload: "order_ref with a trailing slash after 32 characters"}
    expected: {v1_failing_node: check_reference, decision: manual_review, reason_code: ORDER_REF_UNVERIFIED}
negative_cases:
  - id: F18
    input: {payload: "ticket with no account_id"}
    expected: {v1_failing_node: validate, decision: rejected_input, reason_code: INVALID_TICKET}
