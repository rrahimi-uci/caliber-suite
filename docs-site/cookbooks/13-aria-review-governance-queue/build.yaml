workflow_goal: From one clear intent, have Aria plan and create a human-review queue with a label schema and fill it with flagged traces, collecting each step's fields through the plan's input forms.
# Verified against the Aria capability registry + plan executor - see ../ARIA-AUTONOMY.md.
feasibility:
  - Aria's capability registry today = judge.create, review_queue.create, eval_dataset.create, review_queue.add_items, workflow.calibrate (+ the read capabilities judge.list, review_queue.list, openapi_tool.list, openapi_tool.invoke). This scenario lives entirely inside that set.
  - The default planner proposes a step for each non-read capability whose DOMAIN word appears in the goal. "review queue" proposes review_queue.create AND review_queue.add_items (same domain). It is rules, not a model: it does not read negation or questions, and needs the words "review queue" with a space.
  - INPUTS - the planner leaves unknown fields empty; when a step is about to run the executor raises an `input` interaction (UI - "Aria needs information", Continue plan / Skip step; API - POST /aria/interactions/{id}/answer {inputs}). The answer is merged and validated against the capability schema (a bad one is a 409 and the question stays open), then the plan resumes.
  - The planner wires a field that points at an earlier step's result: review_queue.add_items.queue_id comes from review_queue.create.queue_id, so the enqueue form asks for trace_ids only. A step whose producer was skipped is skipped too.
  - add_items does not discover traces and does not check that the ids exist; an unknown id is queued and fails when a reviewer submits it.
  - Reviewers: a queue created outside a workspace is visible to its owner only; the reviewers list is a label. Several reviewers need a workspace (lab 18).
manual_flow:
  - step: state_intent
    action: Open Integrations > Plans, state the one-line intent and pick the autonomy.
  - step: review_plan
    action: Aria drafts a plan (review_queue.create then review_queue.add_items); read the steps.
  - step: approve
    action: Press Approve plan.
  - step: execute_and_answer
    action: Execute; fill the queue's form (name, questions) and the enqueue form (trace ids), press Continue plan; Approve each step under ask_each.
  - step: verify
    action: Open Review Queues; review a trace; read the assessment on the trace.
components:
  aria:
    intent: "Set up a review queue for human labeling of agent replies for safety, citation, and tone."
    autonomy: ask_each
    capabilities:
      - review_queue.create       # TIER_MUTATE
      - review_queue.add_items    # TIER_MUTATE, queue_id wired from the create step
    step_inputs_needed:
      - "review_queue.create: name, questions (array of {key, title, type in [pass_fail, categorical, numeric, text], options (categorical), required, target in [feedback, expectation]}); optional description, reviewers"
      - "review_queue.add_items: trace_ids; optional experiment_id, assigned_to (queue_id is wired)"
  prompts: none
  skills: none
  tools: none
  mcp: none
  workflow: none
contracts:
  intent_schema:
    type: object
    required: [goal]
    properties:
      goal: {type: string}
      autonomy: {type: string}
  output_artifacts:
    type: object
    required: [queue_id]
failure_modes:
  - intent omits "review queue" -> no review step (or no plan at all)
  - a categorical question without options, or duplicate question keys -> the form accepts it, review_queue.create fails the step and the plan
  - a taken queue name -> the step fails the plan
  - the plan's owner lacks the operator scope -> the plan fails at execute and creates nothing
  - a made-up trace id -> queued, then 502 when reviewed
fallbacks:
  - if there are no traces yet, Skip step (or Deny) on the enqueue step; the queue is still created.
  - a failed plan cannot be run again: state the goal again.
