# What the lab verifies, and how. Every item below is asserted by
# sdk/caliber-sdk/examples/cookbooks/cookbook_13_aria_review_queue.py against a real server,
# and (for the UI items) by caliber/caliber-ui/e2e/cookbooks/labs/13-aria-review-queue.spec.ts.
# Verified against the Aria capability registry and plan executor; see ../ARIA-AUTONOMY.md.
feasibility:
  - Aria's planner is deterministic rules, so the plan is checked exactly; no model is involved anywhere in this lab (a review queue is people's work).
  - Plan, step and question state are observable at GET /aria/plans/{id} and GET /aria/plans/{id}/interactions; the queue at GET /review-queues/{id}; a reviewed trace at GET /observability/traces/{id}.
  - review_queue.add_items shares the domain "review_queue", so it is always proposed alongside review_queue.create. It is optional to run: Skip step or Deny it and the queue is still created; skipping the queue skips the enqueue with it.
evaluation:
  plan_checks:
    - planner_matches_dataset                  # 26/26 goals draw the documented steps; every draft is cancelled
    - plan_contains_review_queue_create_then_add_items
    - enqueue_queue_id_wired_from_create_step  # the only wired input; the enqueue form asks for trace_ids only
  artifact_checks:
    - review_queue_active_with_typed_name_and_five_questions
    - queue_holds_30_pending_assigned_traces
    - twelve_reviews_land_as_trace_assessments
    - safety_answers_become_twelve_labelled_examples
  refusal_checks:
    - review_that_does_not_fit_the_questions_is_refused_and_stays_pending
    - reviewed_item_cannot_be_reviewed_again
    - role_without_operator_scope_cannot_review
    - listed_reviewer_who_is_not_the_owner_gets_404
    - unknown_trace_id_is_queued_and_fails_on_review
    - skipping_the_queue_skips_the_enqueue
    - denied_enqueue_keeps_the_queue
    - form_refuses_empty_questions_unknown_field_untitled_question_and_unknown_type
    - categorical_question_without_options_fails_step
    - duplicate_queue_name_fails_step
    - owner_without_operator_scope_fails_at_execute
  real_provider_checks:                              # a --real-llm stack only; skipped automatically on a simulated one
    - real_safety_judge_scores_all_12_reviewed_replies
    - judge_agreement_and_kappa_with_the_reviewers_in_range   # agreement >= 0.75, kappa >= 0.4
    - judge_flags_at_least_half_of_the_unsafe_replies
    - ask_aria_creates_queue_in_build_auto_all_session
    - ask_aria_is_not_offered_review_queue_create_in_default_session
quality_gates:
  planner_agreement: 1.0         # 26 of 26 goals
  steps_completed_min: 2
  required_interactions_answered: true
  artifacts_real: true           # the queue, its 30 items and the 12 assessments exist
monitoring:
  evidence:
    - aria_plan_created
    - aria_step_completed
    - review_queue_created
    - review_items_added
    - submit_review_item
  metrics:
    - steps_completed
    - interactions_count
    - reviews_completed
feedback_loop:
  - reviewers answer the queue's questions; the answers write back onto each trace as assessments.
  - the safety answers feed judge alignment (lab 10); the unsafe traces are candidates for a test set (lab 12) and for calibration (lab 15).
