workflow_goal: From one clear intent about weak runs, have Aria plan and create a review queue, enqueue the flagged traces and kick off an asynchronous workflow calibration, collecting each step's fields through the plan's input forms.
# Verified against the Aria capability registry + plan executor - see ../ARIA-AUTONOMY.md.
feasibility:
  - Aria's capability registry today = judge.create, review_queue.create, eval_dataset.create, review_queue.add_items, workflow.calibrate (+ the read capabilities judge.list, review_queue.list, openapi_tool.list, openapi_tool.invoke). This scenario lives entirely inside that set.
  - The default planner proposes a step for each non-read capability whose DOMAIN word appears in the goal - "review queue" proposes review_queue.create AND review_queue.add_items (same domain); "workflow" proposes workflow.calibrate (whatever the sentence is about). Steps run in registry order. It is rules, not a model.
  - INPUTS - the planner leaves unknown fields empty; when a step is about to run the executor raises an `input` interaction (UI - "Aria needs information", Continue plan / Skip step; API - POST /aria/interactions/{id}/answer {inputs}). The answer is merged and validated against the capability schema (a bad one is a 409 and the question stays open), then the plan resumes. Only review_queue.add_items.queue_id is wired (from review_queue.create).
  - workflow.calibrate is the first ASYNC capability. The handler enqueues a real calibration job (POST /workflows/{id}/calibration/runs equivalent, with the default objective and budget) and returns an AsyncJobHandle; the step parks in waiting_job and the plan stays running. The plan worker polls the job; candidate_ready or applied resolves done and the plan completes (the candidate is NOT applied), rejected, failed or error resolves failed with "<status>: <job error_message>" and fails the plan.
  - Aria passes only workflow_id and agent_id, so the calibration runs with the default objective (maximize quality, a candidate must beat the baseline by 0.02) and budget (20 cases). On the simulated default nothing can beat the baseline, so the job is rejected and the plan fails.
  - The calibration needs an existing workflow, a registered agent and a workflow whose manifest has a deploy gate pointing at a test set with rows; otherwise the step fails at once (404 / 400) and no job is queued.
  - A parked plan cannot be cancelled or edited; it ends when its job does. With the workers off it never ends.
manual_flow:
  - step: state_intent
    action: Open Integrations > Plans, state the one-line intent and pick the autonomy.
  - step: review_plan
    action: Aria drafts a plan (review_queue.create, review_queue.add_items, workflow.calibrate); read the steps.
  - step: approve
    action: Press Approve plan.
  - step: execute_and_answer
    action: Execute; fill the queue's, the enqueue's and the calibration's forms, press Continue plan; Approve each step under ask_each. The last approval parks the plan.
  - step: wait
    action: Do nothing - the Plans page re-reads the running plan every five seconds until the worker settles it.
  - step: verify
    action: Open Review Queues and triage a flagged run; read the job at GET /jobs/{job_id}.
components:
  aria:
    intent: "Our workflow's recent runs look weak - set up a review queue for the flagged traces and kick off a workflow calibration."
    autonomy: ask_each
    capabilities:
      - review_queue.create       # TIER_MUTATE
      - review_queue.add_items    # TIER_MUTATE, queue_id wired from review_queue.create
      - workflow.calibrate        # TIER_MUTATE, ASYNC
    step_inputs_needed:
      - "review_queue.create: name, questions (array of {key, title, type, options, required, target}); optional description, reviewers"
      - "review_queue.add_items: trace_ids; optional experiment_id, assigned_to (queue_id is wired)"
      - "workflow.calibrate: workflow_id, agent_id (existing ones)"
  prompts: none
  skills: none
  tools: [lookup_policy, get_order]    # bound by the subject workflow, not used by Aria
  mcp: none
  workflow: support-policy-agent (the subject; created by assets/setup_subject.py)
contracts:
  intent_schema:
    type: object
    required: [goal]
    properties:
      goal: {type: string}
      autonomy: {type: string}
  output_artifacts:
    type: object
    required: [queue_id, job_id]
failure_modes:
  - intent omits "review queue" or "workflow" -> that step is not planned (or no plan at all)
  - unknown workflow, unregistered agent, or no deploy-gate test set -> the calibrate step fails at once and no job is queued
  - the calibration finds no candidate (the simulated default) -> the job is rejected and the plan fails with the reason
  - workers off -> the plan stays running with the job queued
  - the plan's owner lacks the operator scope -> the plan fails at execute and creates nothing
fallbacks:
  - if the worker has not resumed the plan, POST /aria/plans/{id}/poll reads the job on demand (it cannot run it).
  - a failed plan cannot be run again: state the goal again, or run POST /workflows/{id}/calibration/runs by hand with an objective whose margin is 0.
