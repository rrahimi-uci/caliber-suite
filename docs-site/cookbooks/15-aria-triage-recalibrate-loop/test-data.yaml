# Aria autonomous scenario: the "input" is the INTENT; the "expected" is the plan Aria drafts and what it
# creates or triggers. Two data files, two scripts, a workflow manifest and three form specs live in assets/.
goals:
  file: assets/dataset/goals.jsonl     # {id, goal, expected_steps, outcome, note}
  rows: 28
  by_outcome:
    as_asked: 16     # the plan is what the sentence asked for
    unasked: 7       # a step the sentence did not ask for (negation, a question, "rebuild", "roll back", "outage")
    nothing: 5       # no steps: the plan cannot be approved (409)
  canonical:
    id: G01
    goal: "Our workflow's recent runs look weak - set up a review queue for the flagged traces and kick off a workflow calibration."
    autonomy: ask_each
    expected_steps: [review_queue.create, review_queue.add_items, workflow.calibrate]
runs:
  file: assets/dataset/support-runs.jsonl   # {id, question, reply, tools_called, required_tools, reference, weak, reason}
  rows: 30
  weak: 12                                  # S19..S30: skipped a tool the question needs
  weak_by_failure_mode:
    missing_evidence: 4
    hallucinated_claim: 4
    wrong_tool: 2
    bad_escalation: 2
  roles:
    - the 30-case test set the workflow is calibrated against (input.input = question, expected = {expected: reference, required_tools})
    - the 12 flagged traces (seed_traces.py writes the weak rows only)
    - the labels a reviewer gives
  triaged_by_hand: [S19, S21, S24]
subject:
  workflow: assets/workflows/support-policy-agent.workflow.json   # start -> support_agent (lookup_policy, get_order) -> policy_guardrail -> final; deploy gate on the test set
  tools: [assets/tools/lookup-policy.tool.json, assets/tools/get-order.tool.json]
  setup: assets/setup_subject.py
  traces: assets/seed_traces.py
forms:
  review_queue.create: assets/review-queues/triage-review.queue.json   # name, description, reviewers, questions (4)
  review_queue.add_items: assets/enqueue.json                          # trace_ids, assigned_to (queue_id is wired)
  workflow.calibrate: assets/calibrate.json                            # workflow_id, agent_id
calibration:
  budget: default (max 3 candidates, 20 test set cases)
  objective: default (maximize quality; a candidate must beat the baseline by 0.02)
  simulated_outcome: "rejected: no candidate met calibration gates; quality delta +0.000 < epsilon 0.02"
  real_outcome: candidate_ready (the plan completes; the plan does not apply the candidate)
refusals:
  - id: A15-no-steps
    goal: "Tune the pipeline and get a human to look at the bad runs."
    note: "201 with a warning; approve answers 409."
  - id: A15-unknown-workflow
    inputs: {workflow_id: WF-does-not-exist}
    note: "workflow 'WF-does-not-exist' not found (HTTP 404); the step fails at once, no job."
