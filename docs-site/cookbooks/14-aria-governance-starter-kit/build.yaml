workflow_goal: From one clear intent, have Aria plan and stand up a faithfulness judge, a review queue and a test set, collecting each step's fields through the plan's input forms, then load 30 cases into the test set.
# Verified against the Aria capability registry + plan executor - see ../ARIA-AUTONOMY.md.
feasibility:
  - Aria's capability registry today = judge.create, review_queue.create, eval_dataset.create, review_queue.add_items, workflow.calibrate (+ the read capabilities judge.list, review_queue.list, openapi_tool.list, openapi_tool.invoke). This scenario lives entirely inside that set.
  - The default planner proposes a step for each non-read capability whose DOMAIN word appears in the goal ("judge", "eval dataset" / "test set", "review queue"). "review queue" proposes review_queue.create AND review_queue.add_items (same domain). Steps run in registry order: judge, review queue, test set, enqueue. It is rules, not a model.
  - INPUTS - the planner leaves unknown fields empty; when a step is about to run the executor raises an `input` interaction (UI - "Aria needs information", Continue plan / Skip step; API - POST /aria/interactions/{id}/answer {inputs}). The answer is merged and validated against the capability schema (a bad one is a 409 and the question stays open), then the plan resumes. Each step asks for its own name; only review_queue.add_items.queue_id is wired (from review_queue.create).
  - Autonomy: ask_each adds an Approve/Deny prompt before each mutate step; approve_plan (the default) and auto_guarded run them straight after the input form. The autonomy of a draft can be changed before approval.
  - A denied or skipped step skips the steps that depend on it. A failed step stops the plan and does not undo earlier steps.
  - eval_dataset.create makes the EMPTY test set; example rows are added separately (not an Aria capability).
manual_flow:
  - step: state_intent
    action: Open Operate > Plans, state the one-line intent and pick the autonomy.
  - step: review_plan
    action: Aria drafts a plan (judge, review queue, test set, enqueue); read the steps.
  - step: approve
    action: Press Approve plan.
  - step: execute_and_answer
    action: Execute; fill each step's form and press Continue plan; Approve each step under ask_each; Skip step on the enqueue form (no traces yet).
  - step: verify
    action: Confirm the judge (Judges), the queue (Review Queues) and the test set (Test Sets) exist; add rows.
components:
  aria:
    intent: "Stand up our governance starter kit: a judge for answer faithfulness, an eval dataset to score against, and a review queue for human checks."
    autonomy: ask_each
    capabilities:
      - judge.create            # TIER_MUTATE
      - review_queue.create     # TIER_MUTATE
      - eval_dataset.create     # TIER_MUTATE
      - review_queue.add_items  # TIER_MUTATE, queue_id wired from review_queue.create; skipped in this lab
    step_inputs_needed:
      - "judge.create: name, instructions (must reference {{ inputs }}/{{ outputs }}/{{ expectations }}/{{ conversation }}/{{ trace }}); optional feedback_value_type, description, model, tags"
      - "review_queue.create: name, questions; optional description, reviewers"
      - "eval_dataset.create: name; optional description, tags"
      - "review_queue.add_items: trace_ids; optional experiment_id, assigned_to (queue_id is wired)"
  prompts: none
  skills: none
  tools: none
  mcp: none
  workflow: none
contracts:
  intent_schema:
    type: object
    required: [goal]
    properties:
      goal: {type: string}
      autonomy: {type: string}
  output_artifacts:
    type: object
    required: [judge_id, queue_id, dataset_id]
failure_modes:
  - intent omits a domain word -> the planner skips that capability (or plans nothing, and the plan cannot be approved)
  - judge instructions reference no evaluation variable -> the form accepts it, judge.create fails the step and the plan
  - a name that is already taken -> the step fails the plan; earlier steps stay made
  - the plan's owner lacks the operator scope -> the plan fails at execute and creates nothing
  - no model provider -> the judge cannot run in Evaluations (400)
fallbacks:
  - if an unwanted step is proposed, Deny / Skip step marks it skipped (and what depends on it), or Cancel the draft.
  - a failed plan cannot be run again: state the goal again.
