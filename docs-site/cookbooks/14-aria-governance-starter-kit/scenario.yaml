id: SCN-14
slug: aria-governance-starter-kit
name: "Aria: Governance Starter Kit from Intent"
track: aria
objective: Give Aria a single intent and have it plan and stand up a whole evaluation and governance scaffold - a faithfulness judge, a test set to score against, and a human-review queue - in one plan, with each step's fields entered in the plan's input forms, then load 30 policy cases into the test set and see what the plan does when you deny a step, ask for less, or a step fails half way.
why_it_matters:
  - The flagship "one sentence -> whole governance setup" showcase: judge + test set + review queue, all real, from a single intent.
  - Proves Aria composes multiple mutate capabilities into one plan -> approve -> execute flow, bounded honestly by its real capability registry and its rules-based planner.
  - Shows what an autonomous plan does and does not guarantee: a denied step takes its dependents with it, a failure keeps what was already made.
primary_persona: platform engineer
secondary_personas:
  - AI engineer
  - evaluator
caliber_surfaces:
  - Plans
  - Judges
  - Test Sets
  - Review Queues
  - Evaluations
prerequisites:
  - CALIBER_FEATURE_ARIA=true (Aria and its Plans page are a preview area that ships on by default; set it to false to turn it off). CALIBER_FEATURE_COOKBOOKS=true only for the gallery card.
  - Two extra accounts for the refusals: olga (an operator who does not own the plan) and vera (not an operator). The server must list olga in CALIBER_OPERATOR_USERS and not vera.
  - No model is needed to create the artifacts; a real model provider is needed only to run the judge in Evaluations (refused on the simulated default) and for the Ask Aria chat. A real tier is verified: scripts/cookbook-env.sh up lab14h --flags cookbooks,aria --real-llm with your own OPENAI_API_KEY (README, Run it with a real provider).
time_to_first_value: 15-30 minutes
success_criteria:
  - From the intent alone, Aria drafts judge, review queue, test set and the enqueue step in registry order, and the planner draws the documented plan for all 28 goals in assets/dataset/goals.jsonl.
  - After approval and answering the forms and approval prompts, a real active judge, a review queue and a test set exist under three different names, and the test set takes the 30 cases.
  - The same sentence under a lower autonomy builds the same kit with no approval prompts.
  - The refusals hold: a denied step takes its dependent with it, a failure half way keeps what was made, a role without the operator scope creates nothing.
demo_profile:
  recommended_sequence_index: 14
  tier: aria
  live_demo_minutes: 15-25
  depends_on: []
  included_in:
    - aria_autonomous
  showcase_capabilities:
    - Aria plan decompose -> approve -> execute
    - judge, review queue and test set created from a single intent
    - multi-capability plan composition, with autonomy levels
