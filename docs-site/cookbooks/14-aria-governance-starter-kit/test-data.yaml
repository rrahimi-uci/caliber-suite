# Aria autonomous scenario: the "input" is the INTENT; the "expected" is the plan Aria drafts and the
# artifacts it creates. Two data files and three form specs live in assets/.
goals:
  file: assets/dataset/goals.jsonl     # {id, goal, expected_steps, outcome, note}
  rows: 28
  by_outcome:
    as_asked: 15     # the plan is what the sentence asked for (a review queue always brings add_items)
    unasked: 6       # a step the sentence did not ask for (negation, a question, "delete", "judgement", "workflow")
    missed: 3        # a step the sentence asked for is missing ("held-out set", "review-queue")
    nothing: 4       # no steps: the plan cannot be approved (409)
  canonical:
    id: G01
    goal: "Stand up our governance starter kit: a judge for answer faithfulness, an eval dataset to score against, and a review queue for human checks."
    autonomy: ask_each
    expected_steps: [judge.create, review_queue.create, eval_dataset.create, review_queue.add_items]
cases:
  file: assets/dataset/release-candidate-cases.jsonl   # {id, tags, input: {question, evidence}, expected: {answer}}
  rows: 30
  categories: [leave, expenses, it, benefits, conduct, payroll, remote, onboarding]
  high_risk: [C13, C14, C15, C21, C22]
  hard_cases:
    - C05: sick leave does not cover a pet
    - C07: a 7 hour flight is economy
    - C18: an unregistered partner is not covered
    - C20: a degree programme is not a course
    - C25: tax advice the assistant must not give
    - C30: the buddy's name is not in the evidence
  loading: POST /eval-datasets/{id}/examples (one row per call; every row is a new version, so 30 rows end at version 31)
forms:
  judge.create: assets/judges/answer-faithfulness.judge.json                    # name, feedback_value_type, instructions, tags
  review_queue.create: assets/review-queues/governance-review.queue.json        # name, description, reviewers, questions (4)
  eval_dataset.create: assets/datasets/release-candidates.dataset.json          # name, description, tags
questions_asked:
  ask_each: [input, permission, input, permission, input, permission, input]    # the last is the enqueue form, skipped
  auto_guarded: [input, input, input, input]                                    # the same kit, no approvals
refusals:
  - id: A14-no-steps
    goal: "Create the governance kit."
    note: "201 with a warning; approve answers 409."
