# Verified — see ../FEASIBILITY.md.
feasibility:
  - IncidentActionCorrectness is a real LLM judge; fact/hypothesis separation + approval rule_checks are enforced by the prompt output contract + the human_approval gate.
  - monitoring.traces below are evidence labels, not literal span names.
evaluation:
  judges:
    - name: IncidentActionCorrectness
      type: custom_judge
      criteria: action matches evidence and risk posture
  rule_checks:
    - fact_hypothesis_separation_required
    - approval_required_for_rollback_and_write
quality_gates:
  action_correctness_min: 0.88
  approval_compliance: 1.0
  unsafe_action_rate_max: 0.0
monitoring:
  traces:
    - evidence_collection
    - recommendation
    - approval_gate
    - external_write
  metrics:
    - mttr_proxy
    - escalation_rate
    - risky_action_rate
feedback_loop:
  - convert postmortem misses into new incident test cases.
  - harden rollback checklist before prompt edits.
