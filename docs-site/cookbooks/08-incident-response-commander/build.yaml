workflow_goal: Turn an incident record into a severity and the lowest-risk action, and keep a rollback behind a human approval.
# Run against a real server (scripts/cookbook-env.sh); see README.md and
# sdk/caliber-sdk/examples/cookbooks/cookbook_08_incident_response_copilot.py.
feasibility:
  - The decision is two Data Transform decision tables run in parallel, joined, summarized by a Template and routed by a Router. No model and no Python Code node, so Preview runs it and the deploy gate can replay it.
  - Evidence arrives inside the incident record. Live deployment or health lookups (API Request, MCP) are not in the verified path: no egress and no MCP server on the lab machine.
  - The draft_update agent is simulated under the fake provider.
manual_flow:
  - step: import_test_set
    action: create the test set incident-cases from assets/dataset/incident-cases.jsonl (the workflow import is refused until it exists)
  - step: import_workflow
    action: import assets/workflows/incident-commander.workflow.json with dataset_name pointing at the test set
  - step: preview
    action: preview an incident; the verdict names severity and action
  - step: promote
    action: publish, promote staging (immediate), promote prod (gate replays 41 incidents, then waits for a second person)
  - step: run
    action: run the 41 incidents through the queue against prod; rollbacks pause at review
  - step: approve
    action: a second person approves (ROLLBACK_APPROVED) or rejects (nothing released)
components:
  workflow:
    file: assets/workflows/incident-commander.workflow.json
    nodes:
      - start             # {"incident": {...}} as JSON text
      - fan_out           # parallel
      - ingest            # data_transform mapping
      - severity_table    # data_transform decision_table -> sev1..sev4
      - action_table      # data_transform decision_table -> rollback, disable_feature_flag, scale_out, monitor, gather_more_evidence, escalate_human
      - draft_update      # agent (simulated)
      - join
      - summarize         # template (json): verdict "<severity> <action>"
      - triage_router     # rollback -> review; escalate_human or gather_more_evidence -> handoff_note; else recommendation
      - review            # human_approval
      - rollback_request  # template
      - handoff_note
      - recommendation
      - final
  deploy_gate:
    name: verdict-matches-dataset
    required_for_aliases: [prod]
    scorers: [contains_expected]
    pass_threshold: 1.0
    thresholds: {min_pass_rate: 1.0, min_contains_expected: 1.0, max_error_rate: 0.0}
  drills:
    - assets/workflows/evidence-lookup-drill.workflow.json
    - assets/workflows/missing-tool-drill.workflow.json
    - assets/workflows/status-page-drill.workflow.json
    - assets/workflows/mitigation-wait-drill.workflow.json
contracts:
  input_schema:
    type: object
    required: [incident]
    properties:
      incident:
        type: object
        required: [incident_id, service, environment]
  output:
    text_contains: "Verdict: {verdict, incident_id, service, environment, severity, action, severity_rule, action_rule, stakeholder_update}"
failure_modes:
  - incomplete_evidence_presented_as_fact   # unknown health never yields a rollback; it gathers evidence or escalates
  - unsafe_rollback_recommendation          # a rollback needs a recent high-risk deploy and bad numbers
  - unapproved_rollback                     # review gate; no self-approval
fallbacks:
  - gather_more_evidence when metrics are missing.
  - escalate_human on conflicting evidence.
