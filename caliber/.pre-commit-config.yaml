# Pre-commit hooks. Install once: `pre-commit install`.
# Runs ruff + mypy + basic hygiene checks on every commit.
# Keep this file in sync with .github/workflows/test.yml — the same checks
# should fail locally before they fail in CI.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        # mypy needs the package installed to resolve imports; the venv at .venv/
        # is the contract documented in README "Development". CI runs mypy directly.
        files: ^src/
        additional_dependencies:
          - pydantic>=2.6
          - sqlalchemy>=2.0
          - types-PyYAML

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
