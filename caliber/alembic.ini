# Alembic configuration for CALIBER migrations.
#
# Run from the project root:
#   alembic upgrade head        # apply all migrations to the URL in CALIBER_DATABASE_URL
#   alembic revision --autogenerate -m "msg"  # generate a new migration from model diffs
#
# The migration scripts live alongside the package at src/caliber/db/migrations/
# so they ship inside the wheel and can be located at runtime when CALIBER is
# installed as a dependency.

[alembic]
script_location = src/caliber/db/migrations

# The database URL is read from the CALIBER_DATABASE_URL env var by env.py;
# this stays blank to prevent accidentally hardcoding a connection string.
sqlalchemy.url =

# Use a timestamp + short slug filename convention so migrations sort
# chronologically. The numeric prefix in versions/ is also fine; both work.
file_template = %%(rev)s_%%(slug)s

# Truncate long slugs in filenames.
truncate_slug_length = 40

# Enable identifier autogenerate; CALIBER uses SQLAlchemy 2.0 typing so the
# detector is reliable.
revision_environment = false

[post_write_hooks]
# Ruff-format generated migrations so the diff is clean.
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
