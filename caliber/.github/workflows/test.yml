name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on a new push to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev extras
        run: pip install -e ".[dev]"
      - name: mypy
        run: mypy src

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + dev extras
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Upload coverage (3.11 only)
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    name: Integration (MLflow Prompt Registry + genai.evaluate)
    runs-on: ubuntu-latest
    # Integration tests stand the real MLflow integrations up against a
    # SQLite-backed tracking store. They are slower and pull in the full
    # ``mlflow`` install (we already do that in the unit-test job, but
    # split for clarity and because they will grow over time).
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev extras
        run: pip install -e ".[dev]"
      - name: Run integration tests
        env:
          CALIBER_INTEGRATION_TESTS: "1"
        # ``-m integration`` selects only the suite marked
        # ``@pytest.mark.integration``; the module-level
        # ``pytestmark`` in ``tests/test_integration_mlflow.py``
        # adds the marker and the opt-in skip.
        run: pytest -q -m integration --no-cov

  ui:
    name: UI (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caliber-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: caliber-ui/package-lock.json
      - name: Install JS dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Upload dist for downstream package job
        uses: actions/upload-artifact@v4
        with:
          name: caliber-ui-dist
          path: caliber-ui/dist
          retention-days: 7

  package:
    name: Wheel build (with bundled SPA)
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: pip install build
      - name: Download built SPA
        uses: actions/download-artifact@v4
        with:
          name: caliber-ui-dist
          path: caliber-ui/dist
      - name: Stage SPA into Python package
        # The Hatchling `artifacts` directive in pyproject.toml picks
        # the bundle up from ``src/caliber/ui`` — copy it into place
        # before running the build.
        run: |
          mkdir -p src/caliber/ui
          cp -R caliber-ui/dist/. src/caliber/ui/
      - name: Build sdist + wheel
        run: python -m build
      - name: Confirm SPA assets in the wheel
        # Sanity check that ``index.html`` made it into the wheel.
        # Failing here means the Hatchling include path is wrong.
        run: |
          python -m zipfile -l dist/*.whl | grep -E "caliber/ui/(index\.html|assets/)" | head
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: caliber-dist
          path: dist/
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit installed dependencies
        run: |
          pip install -e ".[dev]"
          pip-audit --strict
      - name: gitleaks (secrets in repo)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
