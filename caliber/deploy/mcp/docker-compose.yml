# Backing services for the CALIBER MCP catalog.
#
# Today: one Postgres with pgvector + Apache AGE backs the `postgres`,
# `pgvector`, and `apache-age` catalog entries. CALIBER's first-party DB MCP
# servers connect through POSTGRES_URL.
#
#   docker compose -f deploy/mcp/docker-compose.yml up -d --build
#
# This file is a development backing store. Do not reuse its superuser-style
# credential for a production MCP server; provision a separate least-privilege
# role/database and point CALIBER_MCP_POSTGRES_URL at it.
#
# Ollama and MinIO can be added here later as additional backing services.

name: caliber-mcp

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: caliber/postgres-vector-graph:pg17
    container_name: caliber-mcp-postgres
    environment:
      POSTGRES_USER: caliber
      POSTGRES_PASSWORD: caliber
      POSTGRES_DB: caliber
    # Preload AGE for every session so the graph functions are usable without a
    # per-connection `LOAD 'age'`; put ag_catalog on the default search_path so
    # cypher(...) resolves unqualified. pgvector needs neither.
    command:
      - postgres
      - "-c"
      - "session_preload_libraries=age"
      - "-c"
      - "search_path=ag_catalog,public"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - default
      - mcp-db-internal
    volumes:
      - caliber_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caliber -d caliber"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caliber_pg_data:

networks:
  mcp-db-internal:
    internal: true
