name: Pages

# The single publisher for https://<owner>.github.io/caliber-suite/. Two things
# want that URL, so this workflow composes both into one artifact rather than
# letting them race:
#
#   /         the CALIBER documentation site (docs-site/), already regenerated
#             and contract-tested by CI's dedicated docs-validation job;
#   /tests/   the Allure test report rendered by CI's ``allure-report`` job.
#
# Why compose here instead of letting CI publish the report itself: a Pages
# deployment REPLACES the whole site. Two workflows deploying independently means
# whichever ran last wins and the other's output silently disappears. CI therefore
# keeps pushing the report to the ``gh-pages`` branch — which is its trend-history
# store, not a served site — and this workflow pulls the rendered artifact in.
#
# The corollary is load-bearing: because a deploy replaces everything, every
# publish must RE-publish the report, or /tests/ 404s until the next CI run.
# That is what the fallback lookup in "Stage the test report" is for.
#
# Size, measured rather than assumed: docs-site is ~26 MB (20 MB of it the overview
# video) and the report is ~126 MB across ~9k files — 105 MB of per-test JSON under
# data/ plus a history/history.json that grows every run. Well inside the 1 GB Pages
# limit, but it is the number to look at first if a deployment starts timing out,
# and the trend history is the part with no upper bound.

on:
  # Publish only after CI succeeds on main, so Pages never serves a docs commit
  # that failed the docs-validation gate.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and in-flight runs are NOT cancelled: a Pages
# deployment can take several minutes to go live, and cancelling one mid-flight
# leaves the environment holding a cancelled deployment. A superseded run costs a
# few minutes; a wedged deployment costs an outage.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # read CI's rendered-report artifact
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A failed CI run has no report worth publishing, but a docs push or a manual
    # dispatch should still deploy.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Stage the test report at /tests/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set only on a workflow_run trigger: the CI run that just finished.
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -uo pipefail
          mkdir -p docs-site/tests
          try_stage() {
            local candidate="$1"
            [ -n "$candidate" ] || return 1
            rm -rf docs-site/tests
            mkdir -p docs-site/tests
            if gh run download "$candidate" -n allure-report-html -D docs-site/tests; then
              echo "staged the Allure report from CI run $candidate"
              return 0
            fi
            return 1
          }

          run_id="${TRIGGER_RUN_ID:-}"
          if try_stage "$run_id"; then
            exit 0
          fi

          # Fast-only CI runs may not produce a rendered report. Preserve /tests/
          # by falling back to the newest successful CI run on main that still has
          # the artifact.
          mapfile -t fallback_runs < <(
            gh run list --workflow=ci.yml --branch main --status success --limit 10 \
              --json databaseId -q '.[].databaseId'
          )
          for candidate in "${fallback_runs[@]}"; do
            if [ -n "$run_id" ] && [ "$candidate" = "$run_id" ]; then
              continue
            fi
            if try_stage "$candidate"; then
              echo "::warning::current CI run had no Allure artifact; reused report from CI run $candidate"
              exit 0
            fi
          done

          echo "::warning::no successful CI run on main had an allure-report-html artifact; /tests/ will be absent"
          rmdir docs-site/tests 2>/dev/null || true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Bounded on purpose. A Pages deployment that cannot proceed parks in
    # `waiting` indefinitely and, because the concurrency group above is not
    # cancel-in-progress, holds the group while every later run queues behind it
    # or is cancelled. That happened: one deployment sat in `waiting` for 59
    # hours, four runs behind it never published, and not one of them reported
    # as failed. A timeout converts that silence into a red run.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The gate this workflow was missing. `deploy` reporting success means the
  # deployment API accepted an artifact -- not that a reader can fetch the site.
  # The two came apart for 59 hours: the composed layout was correct in this file
  # and absent from the web, and nothing compared them. This job is the
  # comparison, and it reads the live URL rather than any workflow's exit code.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the published site and check what it actually serves
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url || 'https://rrahimi-uci.github.io/caliber-suite/' }}
        run: python3 .github/scripts/verify_published_site.py "$PAGE_URL"
