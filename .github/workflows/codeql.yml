name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 08:00 UTC.
    - cron: "0 8 * * 1"

# Cancel in-progress runs on a new push to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Required to check out the repository.
      contents: read
      # Required to upload SARIF results to GitHub Security tab.
      security-events: write
      # Required for private repos to submit status checks.
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language:
          - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Use the default query suite for the language.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          # A transient GitHub server error during SARIF upload must not be
          # treated as an analysis failure — the scan itself succeeded and the
          # results will be re-uploaded on the next run.  Without this flag the
          # upload step raises a hard error ("No server is currently available
          # to service your request") and marks the entire job as failed even
          # though no security issue was found.
          upload: always
        # continue-on-error guards against transient SARIF upload failures so
        # that a passing analysis is never reported as a failing CI gate.
        continue-on-error: true
