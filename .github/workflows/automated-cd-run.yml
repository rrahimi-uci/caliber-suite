name: Automated CD execution

on:
  schedule:
    - cron: '0 4 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      retry_issue:
        description: 'Blocked issue number after Project claim and remote branch reconciliation'
        required: false
        type: string
      trial_tasks:
        description: 'Owner-only manual trial: up to five new task attempts today'
        required: false
        type: number
        default: 0
      diagnose_state:
        description: 'Read a bounded diagnostic from the latest encrypted state; execute no tasks'
        required: false
        type: boolean
        default: false
      export_incident:
        description: 'With diagnosis, upload private evidence encrypted under the temporary incident key'
        required: false
        type: boolean
        default: false
      incident_issue:
        description: 'Issue number whose latest attempt is exported when export_incident is true'
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: caliber-automated-cd-execution
  cancel-in-progress: false

jobs:
  execute:
    if: github.repository == 'rrahimi-uci/caliber-suite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # A real PostgreSQL for task QA. The unprivileged worker has no Docker access (that
    # would be root-equivalent), so it reaches this server over localhost instead. The
    # container lives only for this run and its credentials are throwaway.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: caliber
          POSTGRES_PASSWORD: caliber
          POSTGRES_DB: caliber_autocd_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caliber -d caliber_autocd_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Read only by scripts/ci-local.sh's PostgreSQL jobs. Do not name it
      # CALIBER_TEST_POSTGRES_URL: that would switch on the PostgreSQL cases of every
      # QA command, including the full coverage suite.
      CALIBER_CI_LOCAL_POSTGRES_URL: postgresql+psycopg://caliber:caliber@localhost:5432/caliber_autocd_admin
      AUTOCD_REPO_ROOT: ${{ github.workspace }}
      AUTOCD_STATE_DIR: /tmp/caliber-autocd-state-${{ github.run_id }}
      AUTOCD_WORKTREE_DIR: /tmp/caliber-autocd-worktrees-${{ github.run_id }}
      AUTOCD_DAILY_TIME: '04:00'
      AUTOCD_TIMEZONE: America/Los_Angeles
      AUTOCD_WORKER_USER: autocdqa
      DISABLE_AUTOUPDATER: '1'
    steps:
      - name: Initialize durable state slot
        run: |
          install -d -m 700 "$AUTOCD_STATE_DIR"
          umask 077
          python3 -c 'import os,sqlite3; sqlite3.connect(os.path.join(os.environ["AUTOCD_STATE_DIR"], "workflow.sqlite3")).close()'
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate incident dispatch inputs
        env:
          AUTOCD_DIAGNOSE: ${{ inputs.diagnose_state || false }}
          AUTOCD_EXPORT: ${{ inputs.export_incident || false }}
          AUTOCD_INCIDENT_ISSUE: ${{ inputs.incident_issue || '' }}
          AUTOCD_RETRY_ISSUE: ${{ inputs.retry_issue || '' }}
          AUTOCD_TRIAL_TASKS: ${{ inputs.trial_tasks || 0 }}
        run: |
          case "$AUTOCD_TRIAL_TASKS" in 0|1|2|3|4|5) ;; *) echo 'trial_tasks must be 0 through 5'; exit 1 ;; esac
          if [ "$AUTOCD_TRIAL_TASKS" != 0 ] && { [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_ACTOR" != rrahimi-uci ] || [ "$GITHUB_TRIGGERING_ACTOR" != rrahimi-uci ] || [ "$AUTOCD_DIAGNOSE" = true ]; }; then
            echo 'Measured task trial requires an owner manual execution'; exit 1
          fi
          if [ -n "$AUTOCD_INCIDENT_ISSUE" ] && { [ "$AUTOCD_DIAGNOSE" != true ] || [ "$AUTOCD_EXPORT" != true ]; }; then
            echo 'incident_issue requires diagnosis and incident export'; exit 1
          fi
          if [ "$AUTOCD_EXPORT" = true ] && { [ "$AUTOCD_DIAGNOSE" != true ] || [ -z "$AUTOCD_INCIDENT_ISSUE" ]; }; then
            echo 'Incident export requires diagnosis and an issue number'; exit 1
          fi
          if [ "$AUTOCD_DIAGNOSE" = true ] && [ -n "$AUTOCD_RETRY_ISSUE" ]; then
            echo 'Diagnosis cannot retry an issue'; exit 1
          fi
      - uses: actions/setup-node@v4
        if: ${{ inputs.diagnose_state != true }}
        with:
          node-version: '22'
      - name: Install coordinator
        run: python -m pip install -e './automated-cd'
      - name: Install Claude Code
        if: ${{ inputs.diagnose_state != true }}
        run: |
          python -m pip install uv
          npm install --global @anthropic-ai/claude-code
          python - <<'PY'
          import re, subprocess
          raw = subprocess.check_output(['claude', '--version'], text=True)
          match = re.search(r'(\d+)\.(\d+)\.(\d+)', raw)
          if not match or tuple(map(int, match.groups())) < (2, 1, 314):
              raise SystemExit('Claude Code >=2.1.314 is required for working-directory file-tool restrictions')
          PY
      - name: Require state key
        env:
          AUTOCD_STATE_KEY: ${{ secrets.AUTOCD_STATE_KEY }}
        run: python -c 'from autocd.state_crypto import _key; _key()'
      - name: Require execution credentials
        if: ${{ inputs.diagnose_state != true }}
        env:
          AUTOCD_GH_TOKEN: ${{ secrets.AUTOCD_GH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$AUTOCD_GH_TOKEN" || { echo 'AUTOCD_GH_TOKEN secret is required'; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo 'ANTHROPIC_API_KEY secret is required'; exit 1; }
      - name: Restore coordinator state
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOCD_STATE_KEY: ${{ secrets.AUTOCD_STATE_KEY }}
        run: |
          prior_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=caliber-autocd-state&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -n "$prior_run" ]; then
            mkdir "$AUTOCD_STATE_DIR/prior"
            gh run download "$prior_run" --repo "$GITHUB_REPOSITORY" --name caliber-autocd-state --dir "$AUTOCD_STATE_DIR/prior"
            if [ -f "$AUTOCD_STATE_DIR/prior/workflow.state.enc" ]; then
              python -m autocd.state_crypto open "$AUTOCD_STATE_DIR/prior/workflow.state.enc" "$AUTOCD_STATE_DIR/workflow.sqlite3"
            elif [ "$prior_run" = 42184186278 ] && [ -f "$AUTOCD_STATE_DIR/prior/workflow.sqlite3" ]; then
              cp "$AUTOCD_STATE_DIR/prior/workflow.sqlite3" "$AUTOCD_STATE_DIR/workflow.sqlite3"
              echo 'Restored known pre-encryption state artifact'
            else
              echo 'Prior state artifact is not encrypted or approved for one-time migration'; exit 1
            fi
          else
            previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow automated-cd-run.yml --branch main --limit 100 --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
            if [ "$previous" -gt 0 ]; then
              echo 'Prior execution exists but no state artifact is available; manual reconciliation is required'
              exit 1
            fi
          fi
      - name: Diagnose latest task safely
        if: ${{ inputs.diagnose_state == true }}
        env:
          AUTOCD_RETRY_ISSUE: ${{ inputs.retry_issue || '' }}
        run: |
          test -z "$AUTOCD_RETRY_ISSUE" || { echo 'Diagnosis cannot retry an issue'; exit 1; }
          python -m autocd.diagnostics
      - name: Export encrypted incident evidence
        if: ${{ inputs.diagnose_state == true && inputs.export_incident == true }}
        env:
          AUTOCD_DIAG_KEY: ${{ secrets.AUTOCD_DIAG_KEY }}
          AUTOCD_INCIDENT_ISSUE: ${{ inputs.incident_issue || '' }}
        run: python -m autocd.incident
      - name: Save encrypted incident evidence
        if: ${{ inputs.diagnose_state == true && inputs.export_incident == true }}
        uses: actions/upload-artifact@v4
        with:
          name: caliber-autocd-incident
          path: /tmp/caliber-autocd-state-${{ github.run_id }}/incident.enc
          if-no-files-found: error
          retention-days: 1
      - name: Create isolated task user
        if: ${{ inputs.diagnose_state != true }}
        run: |
          sudo useradd --create-home --shell /bin/bash autocdqa
          path="$GITHUB_WORKSPACE"
          sudo chmod o+rx "$path"
          while [ "$path" != / ]; do
            path=$(dirname "$path")
            sudo chmod o+x "$path"
          done
      - name: Verify worker isolation
        if: ${{ inputs.diagnose_state != true }}
        run: |
          mkdir -p "$AUTOCD_WORKTREE_DIR"
          chmod 755 "$AUTOCD_WORKTREE_DIR"
          sudo -u autocdqa -- test -x "$AUTOCD_WORKTREE_DIR"
          if sudo -u autocdqa -- test -r "$AUTOCD_STATE_DIR/workflow.sqlite3"; then
            echo 'Worker can read coordinator state'; exit 1
          fi
          sudo -u autocdqa -- test -d "$GITHUB_WORKSPACE"
          mkdir "$AUTOCD_WORKTREE_DIR/smoke"
          sudo chown autocdqa:autocdqa "$AUTOCD_WORKTREE_DIR/smoke"
          sudo -E -H -u autocdqa -- env PATH="$PATH" sh -c '
            test "$HOME" = /home/autocdqa
            command -v uv && command -v claude && command -v python3.11
            claude --version
            uv venv "$1/venv" --python 3.11
          ' sh "$AUTOCD_WORKTREE_DIR/smoke"
          # Reviewer prompts exceed Linux's 128 KiB single-argument limit, so the
          # worker sudo path must carry large prompts on stdin before any model spend.
          head -c 400000 /dev/zero | sudo -E -H -u autocdqa -- env PATH="$PATH" sh -c 'test "$(wc -c)" -ge 400000'
      - name: Verify Project access
        if: ${{ inputs.diagnose_state != true }}
        env:
          GH_TOKEN: ${{ secrets.AUTOCD_GH_TOKEN }}
        run: |
          python - <<'PY'
          import subprocess
          response = subprocess.check_output(['gh', 'api', '-i', 'user'], text=True)
          header = next((line for line in response.splitlines()
                         if line.lower().startswith('x-oauth-scopes:')), '')
          scopes = {scope.strip() for scope in header.partition(':')[2].split(',') if scope.strip()}
          required = {'project', 'public_repo'}
          allowed = required | {'read:project'}
          if not required.issubset(scopes) or scopes - allowed:
              raise SystemExit('AUTOCD_GH_TOKEN must have only project and public_repo scopes')
          print('Scoped Project token verified')
          PY
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions.push')" = true
          actor=$(gh api user --jq '.login')
          echo "Project-token actor: $actor"
          test "$actor" = rrahimi-uci || { echo 'Project token is not owned by rrahimi-uci'; exit 1; }
          project_id=$(gh api graphql -f "query=query(\$login:String!,\$number:Int!){user(login:\$login){projectV2(number:\$number){id closed owner{... on User{login}}}}}" -F login=rrahimi-uci -F number=3 --jq '.data.user.projectV2 | select(.owner.login == "rrahimi-uci" and .closed == false) | .id')
          test -n "$project_id" || { echo 'Project #3 is unavailable to the scoped token'; exit 1; }
          gh auth setup-git --hostname github.com
          python -m autocd.cli plan
      - name: Start and monitor workflow
        if: ${{ inputs.diagnose_state != true }}
        env:
          GH_TOKEN: ${{ secrets.AUTOCD_GH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTOCD_RUN_MODE: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          AUTOCD_RETRY_ISSUE: ${{ inputs.retry_issue || '' }}
          AUTOCD_TRIAL_TASKS: ${{ inputs.trial_tasks || 0 }}
        run: timeout --signal=TERM --kill-after=2m 300m python -m autocd.hosted
      - name: Report bounded failure diagnostic
        if: ${{ failure() && steps.restore.outcome == 'success' && inputs.diagnose_state != true }}
        run: python -m autocd.diagnostics
      - name: Report measured task time and Claude spend
        if: ${{ always() && steps.restore.outcome == 'success' && inputs.diagnose_state != true }}
        run: python -m autocd.usage_report
      - name: Encrypt coordinator state
        if: ${{ always() && steps.restore.outcome == 'success' && inputs.diagnose_state != true && inputs.export_incident != true }}
        env:
          AUTOCD_STATE_KEY: ${{ secrets.AUTOCD_STATE_KEY }}
        run: python -m autocd.state_crypto seal "$AUTOCD_STATE_DIR/workflow.sqlite3" "$AUTOCD_STATE_DIR/workflow.state.enc"
      - name: Save coordinator state
        if: ${{ always() && steps.restore.outcome == 'success' && inputs.diagnose_state != true && inputs.export_incident != true }}
        uses: actions/upload-artifact@v4
        with:
          name: caliber-autocd-state
          path: /tmp/caliber-autocd-state-${{ github.run_id }}/workflow.state.enc
          if-no-files-found: error
          retention-days: 90
