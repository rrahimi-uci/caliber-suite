name: CI

# Repo-root workflow. GitHub only discovers workflows under <repo-root>/.github/
# workflows/, so this file — not caliber/.github/workflows/ — is what actually
# runs in the caliber-suite monorepo. All Python steps run inside ``caliber/``
# (where pyproject.toml lives); the UI steps run inside ``caliber/caliber-ui/``.
#
# Speed model:
#   * uv replaces pip for every install (cached wheels, ~10-50x faster).
#   * Allure results are emitted from a SINGLE Python version (3.11) so the
#     combined report shows each test once, not once per matrix leg.
#   * Unit tests run under pytest-xdist (``-n auto``); integration tests stay
#     sequential (they stand up real MLflow/SQLite and are not parallel-safe).
#
# Allure model:
#   * Test jobs only EMIT allure-results/ (no Java needed) and upload them as
#     artifacts. One ``allure-report`` job merges every result set and renders the
#     HTML with trend history. It does NOT deploy: a Pages deployment replaces the
#     whole site, so pages.yml is the single publisher and serves this report at
#     /tests/ by downloading the ``allure-report-html`` artifact.

on:
  push:
    branches: [main]
    paths-ignore: &non-ci-paths
      # Skip the ~38 billable minutes a full run costs when a commit changes
      # nothing any job reads. GitHub only skips when EVERY changed file matches,
      # so a mixed docs+code commit still runs the whole suite.
      #
      # Each entry below is verified to be read by no test and no build step:
      #   overview-video/**  not referenced anywhere under caliber/tests/
      #
      # Deliberately NOT ignored, because they ARE test or build inputs:
      #   docs/**            UI prebuild regenerates docs-site from these sources
      #   docs-site/**       tests/test_cookbook_doc_contract.py reads
      #                      docs-site/cookbooks/** and asserts doc/code parity
      #   caliber/caliber-ui/public/docs/**
      #                      regenerated by the caliber-ui prebuild (sync-docs)
      #   .github/workflows/**
      #                      a CI change must always be exercised by CI
      - "overview-video/**"
  pull_request:
    branches: [main]
    paths-ignore: *non-ci-paths

# Cancel in-progress runs on a new push to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The project's documented dev profile (caliber/Makefile: install-extended)
  # plus ``memory`` (mem0), which a unit test imports. Installed in every Python
  # job so tests and mypy can resolve every optional integration. ``knowledge-
  # local`` pulls torch — the heaviest dep — but it's required for the
  # embedding/KB suites to pass; uv's cache keeps repeat installs cheap.
  CALIBER_CI_EXTRAS: dev,postgres,ingest,ocr,llm,knowledge,dspy,knowledge-local,memory

defaults:
  run:
    working-directory: caliber

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: caliber/pyproject.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff
        # Pinned (not ">=0.5") so the format check is deterministic — ruff's
        # formatter output shifts between releases, which is what let the repo
        # drift out of "formatted" while CI was dormant.
        run: uv pip install --system "ruff==0.15.20"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  sdk:
    name: SDK (caliber-sdk)
    runs-on: ubuntu-latest
    # Overrides the repo-wide ``caliber`` default: caliber-sdk is a separate
    # distribution at the repository root, with its own ruff, mypy, and pytest
    # configuration. Inheriting the server's would be the accident this layout
    # exists to avoid.
    defaults:
      run:
        working-directory: sdk/caliber-sdk
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: sdk/caliber-sdk/pyproject.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the SDK and its dev extras
        run: uv pip install --system -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: mypy (strict)
        run: mypy
      - name: pytest
        run: pytest
      - name: Build the wheel
        run: |
          uv pip install --system build
          python -m build --wheel --outdir dist
      - name: Assert the SDK installs without the server
        # The whole reason caliber-sdk is a separate distribution. A dependency
        # added carelessly would silently drag mlflow into every developer
        # script; this fails the build instead.
        run: |
          python - <<'CHECK'
          import glob, re, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          archive = zipfile.ZipFile(wheel)
          name = next(n for n in archive.namelist() if n.endswith("METADATA"))
          metadata = archive.read(name).decode()
          runtime = [
              line for line in re.findall(r"^Requires-Dist: (.+)$", metadata, re.M)
              if "extra ==" not in line
          ]
          banned = [r for r in runtime if re.search(r"mlflow|sqlalchemy|starlette", r, re.I)]
          print("runtime requirements:", runtime)
          if banned:
              sys.exit(f"caliber-sdk must not depend on the server runtime: {banned}")
          CHECK


  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: caliber/pyproject.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package + dev extras
        run: uv pip install --system -e ".[$CALIBER_CI_EXTRAS]"
      - name: mypy
        run: mypy src

  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest
    # Single canonical version: running the full ~15-min suite once (not across a
    # 3-version matrix) is the biggest wall-clock win. This leg carries coverage
    # and emits Allure results.
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: caliber/pyproject.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package + dev extras
        run: uv pip install --system -e ".[$CALIBER_CI_EXTRAS]"
      # Balance free-function modules across workers. Tests with real subprocess timing
      # or loopback-port coupling use explicit ``xdist_group`` serialization.
      - name: Run tests (coverage + Allure)
        run: pytest -n auto --dist loadgroup --alluredir=allure-results
      - name: Upload coverage
        if: ${{ !cancelled() }}
        # Evidence publication, not a test. Artifact storage is metered per
        # ACCOUNT, so an unrelated repository can exhaust it and turn this green
        # job red — which is worse than losing the report, because it hides real
        # failures behind a platform condition. The step still runs and still
        # logs its error; it just cannot fail the build. The absence of the
        # artifact is the signal that evidence is missing.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          # The repo's coverage plugin rewrites --cov-report=xml to a
          # process-unique path under .pytest_cache/coverage/ (see
          # caliber/src/caliber/pytest_coverage_bootstrap.py), so glob it
          # rather than the default coverage.xml (which is never written).
          path: caliber/.pytest_cache/coverage/coverage.*.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Allure results (backend)
        if: ${{ !cancelled() }}
        # Evidence publication, not a test. Artifact storage is metered per
        # ACCOUNT, so an unrelated repository can exhaust it and turn this green
        # job red — which is worse than losing the report, because it hides real
        # failures behind a platform condition. The step still runs and still
        # logs its error; it just cannot fail the build. The absence of the
        # artifact is the signal that evidence is missing.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-backend
          path: caliber/allure-results
          if-no-files-found: warn
          retention-days: 1

  compatibility:
    name: Compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Python 3.11 remains the one full-suite/coverage verdict. These edge-version legs
    # keep the declared 3.10-3.12 package range honest without tripling the full CI cost:
    # each version must install the real package and cross config, migration, and
    # authentication/session boundaries successfully.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: caliber/pyproject.toml
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run compatibility smoke tests
        run: >-
          pytest
          tests/test_config.py
          tests/test_migrations.py
          tests/test_auth_sessions.py
          --no-cov
          -q

  integration:
    name: Integration (MLflow Prompt Registry + genai.evaluate)
    runs-on: ubuntu-latest
    # Integration tests stand the real MLflow integrations up against a
    # SQLite-backed tracking store — slower and not parallel-safe, so they run
    # sequentially (no -n) after the fast gates pass.
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: caliber/pyproject.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package + dev extras
        run: uv pip install --system -e ".[$CALIBER_CI_EXTRAS]"
      - name: Run integration tests
        env:
          CALIBER_INTEGRATION_TESTS: "1"
        run: pytest -m integration --no-cov --alluredir=allure-results
      - name: Upload Allure results (integration)
        if: ${{ !cancelled() }}
        # Evidence publication, not a test. Artifact storage is metered per
        # ACCOUNT, so an unrelated repository can exhaust it and turn this green
        # job red — which is worse than losing the report, because it hides real
        # failures behind a platform condition. The step still runs and still
        # logs its error; it just cannot fail the build. The absence of the
        # artifact is the signal that evidence is missing.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-integration
          path: caliber/allure-results
          if-no-files-found: warn
          retention-days: 1

  ui:
    name: UI (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caliber/caliber-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: caliber/caliber-ui/package-lock.json
      - name: Install JS dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npx eslint .
      # ``npm test`` (vitest) emits Allure results to allure-results/ via the
      # configured allure-vitest reporter. vitest is pinned to a single worker
      # in vitest.config.ts, so this is sequential by design.
      - name: Run unit tests (emits Allure results)
        run: npm test
      - name: Build
        env:
          CALIBER_DOCS_STRICT: "1"
        run: npm run build
      - name: Require committed generated docs to match their sources
        working-directory: ${{ github.workspace }}
        run: >-
          git diff --exit-code --
          docs-site
          caliber/caliber-ui/public/docs
          caliber/src/caliber/ui/docs
      # Convenience hand-off only. The package job rebuilds the SPA when this is
      # absent, so a failed upload costs build minutes rather than a skipped
      # release job. Non-fatal for the same reason as the evidence uploads below:
      # account-level artifact storage is outside this repository's control.
      - name: Upload dist for downstream package job
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: caliber-ui-dist
          path: caliber/caliber-ui/dist
          retention-days: 7
      - name: Upload Allure results (UI)
        if: ${{ !cancelled() }}
        # Evidence publication, not a test. Artifact storage is metered per
        # ACCOUNT, so an unrelated repository can exhaust it and turn this green
        # job red — which is worse than losing the report, because it hides real
        # failures behind a platform condition. The step still runs and still
        # logs its error; it just cannot fail the build. The absence of the
        # artifact is the signal that evidence is missing.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-ui
          path: caliber/caliber-ui/allure-results
          if-no-files-found: warn
          retention-days: 1

  cookbook-ui-only:
    name: Cookbook UI-only browser journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: caliber/pyproject.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CALIBER test runtime
        working-directory: caliber
        run: |
          uv venv .venv --python 3.11
          uv pip install --python .venv/bin/python -e ".[dev,llm]"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: caliber/caliber-ui/package-lock.json
      - name: Install UI dependencies
        working-directory: caliber/caliber-ui
        run: npm ci
      - name: Install Chromium
        working-directory: caliber/caliber-ui
        run: npx playwright install --with-deps chromium
      - name: Run browser-only Cookbook journeys on an isolated database
        working-directory: caliber/caliber-ui
        run: npm run test:e2e:cookbooks
      - name: Clean isolated Cookbook test state
        if: ${{ always() }}
        working-directory: caliber
        run: |
          CALIBER_E2E_TMP_ROOT="$PWD/.tmp/cookbooks-ui-only" \
            MLFLOW_PORT=5160 \
            bash scripts/run-playwright-server.sh --force-cleanup
          rm -rf .tmp/cookbooks-ui-only caliber-ui/test-results caliber-ui/playwright-report

  allure-report:
    name: Allure report
    runs-on: ubuntu-latest
    needs: [test, integration, ui, cookbook-ui-only]
    # Render even when suites fail — surfacing failures is the whole point of
    # the report. Only skip if the run was cancelled.
    if: ${{ !cancelled() }}
    # gh-pages publish pushes a branch with the default GITHUB_TOKEN.
    permissions:
      contents: write
    # Override the repo-wide ``caliber`` working dir: download-artifact writes
    # allure-results/ to the workspace root, so the render steps run there too.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      # Merge every suite's results into one dir (UUID-named files never collide).
      - name: Download all Allure results
        id: fetch_results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      # Whether there is anything to render is a real question with two honest
      # answers, so it is computed once and every later step keys off it rather
      # than each one failing its own way.
      - name: Check whether any results were published
        id: have_results
        run: |
          if [ -n "$(find allure-results -type f -name '*.json' 2>/dev/null | head -1)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Allure results were published, so no report can be" \
              "rendered. The suites' own pass/fail verdicts are unaffected — see the" \
              "test, integration, and ui jobs. This is expected while account-level" \
              "artifact storage is exhausted."
          fi
      # Render with the official Allure CLI + a real JRE rather than a
      # third-party Docker action (the popular ones pin removed base images
      # like openjdk:8-jre-alpine). This reuses the same allure-commandline the
      # repo already vendors locally.
      - name: Set up Java (Allure CLI needs a JRE)
        if: steps.have_results.outputs.found == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Allure CLI
        if: steps.have_results.outputs.found == 'true'
        run: npm install -g allure-commandline@2.30.0
      # Pull prior gh-pages content so Allure can carry trend history forward.
      - name: Load report history
        if: steps.have_results.outputs.found == 'true'
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - name: Carry trend history forward
        if: steps.have_results.outputs.found == 'true'
        run: |
          if [ -d gh-pages/history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/history/. allure-results/history/
          fi
      - name: Generate report
        if: steps.have_results.outputs.found == 'true'
        run: allure generate allure-results --clean -o allure-report
      # This artifact is what actually reaches the published site: the Pages
      # workflow downloads it and stages it at /tests/. Do not rename it without
      # updating .github/workflows/pages.yml, which looks it up by this name.
      - name: Upload rendered report (HTML)
        # Evidence publication; see the uploads in the test job.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-html
          path: allure-report
          retention-days: 14
      # gh-pages is a STORE, not a served site. A Pages deployment replaces the
      # whole site, so this job must not deploy: pages.yml is the single publisher
      # and serves this report at /tests/. What the branch is still for is trend
      # history — "Load report history" above reads its history/ back as the seed
      # for the next run's trend graphs, which is why the push is retained.
      #
      # Push only from main — PRs (incl. forks) can't write and shouldn't
      # overwrite the canonical history.
      - name: Store report on gh-pages (trend-history seed)
        if: ${{ github.ref == 'refs/heads/main' && steps.have_results.outputs.found == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

  compose:
    name: Compose merged-config validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate all included services and profiles
        env:
          COMPOSE_DISABLE_ENV_FILE: "1"
        run: >-
          docker compose
          --env-file deploy/.env.example
          --env-file .env.example
          -f deploy/compose.yaml
          --profile app
          --profile nats
          config --quiet

  package:
    name: Wheel build (with bundled SPA)
    runs-on: ubuntu-latest
    # Only ``ui``, and deliberately. This job asserts the wheel contains a bundled
    # SPA — a correct check that had never once executed, because it sat behind
    # six unrelated jobs and any one of them failing skipped it. Twelve
    # consecutive runs counted it as coverage while it produced no evidence, and
    # the first time it ran it failed: the wheel target had a comment claiming it
    # included the SPA and no ``artifacts`` key to do it.
    #
    # Sequencing a release gate behind the test suite buys nothing — a wheel with
    # no SPA is broken whether or not the tests pass, and that is exactly when you
    # most want to know. ``ui`` stays because this job consumes its dist artifact,
    # and even that is soft: the download is ``continue-on-error`` with a rebuild
    # fallback below.
    needs: [ui]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: caliber/pyproject.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: uv pip install --system build twine
      # ``continue-on-error`` + a rebuild fallback rather than a hard dependency.
      # The SPA is *reproducible from source*, so coupling the release job to an
      # artifact hand-off traded a few build minutes for a job that skips entirely
      # whenever account-level artifact storage is full. Rebuilding is the honest
      # trade: slower, always available, and it verifies the wheel contains a SPA
      # this commit actually produces.
      - name: Download built SPA
        id: fetch_spa
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: caliber-ui-dist
          path: caliber/caliber-ui/dist
      - name: Set up Node (only when the SPA must be rebuilt)
        if: steps.fetch_spa.outcome != 'success'
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: caliber/caliber-ui/package-lock.json
      - name: Rebuild the SPA
        if: steps.fetch_spa.outcome != 'success'
        working-directory: caliber/caliber-ui
        env:
          CALIBER_DOCS_STRICT: "1"
        run: |
          echo "dist artifact unavailable (upload likely blocked by artifact storage); rebuilding from source"
          npm ci
          npm run build
      - name: Stage SPA into Python package
        run: |
          test -f caliber-ui/dist/index.html \
            || { echo "::error::no SPA build available to package"; exit 1; }
          mkdir -p src/caliber/ui
          cp -R caliber-ui/dist/. src/caliber/ui/
      - name: Build sdist + wheel
        run: python -m build
      - name: Check distribution metadata and contents
        run: |
          twine check dist/*
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if not wheels or not sdists:
              raise SystemExit("build did not produce both a wheel and an sdist")

          with zipfile.ZipFile(wheels[-1]) as archive:
              names = archive.namelist()
          if "caliber/ui/index.html" not in names or not any(
              name.startswith("caliber/ui/assets/") for name in names
          ):
              raise SystemExit("wheel is missing the bundled SPA")
          required_docs = {
              "caliber/ui/docs/m-00-layered-architecture.html",
              "caliber/ui/docs/m-00-layered-architecture.md",
          }
          missing_docs = required_docs.difference(names)
          if missing_docs:
              raise SystemExit(
                  "wheel is missing layered architecture documentation: "
                  + ", ".join(sorted(missing_docs))
              )

          forbidden = {
              "node_modules", "allure-results", "allure-report", "playwright-report",
              "test-results", "htmlcov", "mlruns", ".pytest_cache", ".mypy_cache",
              ".ruff_cache", ".tmp",
          }
          with tarfile.open(sdists[-1]) as archive:
              members = archive.getnames()
          leaked = [
              name for name in members
              if forbidden.intersection(Path(name).parts)
              or any(part.startswith((".coverage", ".venv")) for part in Path(name).parts)
          ]
          if leaked:
              raise SystemExit("sdist contains local evidence/cache files: " + ", ".join(leaked[:10]))
          print(f"validated {wheels[-1].name} and {sdists[-1].name}")
          PY
      - name: Upload distributions
        # Evidence publication; see the uploads in the test job.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: caliber-dist
          path: caliber/dist/
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits via the API to scope its scan, which
    # needs pull-requests:read on top of the workflow's default contents:read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # fetch-depth: 0 — gitleaks scans the PR commit range (BASE^..HEAD); the
      # default depth-1 checkout lacks the base commit, so its git log errors
      # ("stderr is not empty") and the action exits non-zero even with no leaks.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Audit dependencies in an isolated supported-Python environment
        # Do not audit packages preinstalled in the mutable GitHub runner image.
        # The repository helper creates a clean venv, freezes the exact resolved
        # third-party set, and runs pip-audit --strict against that evidence.
        run: >-
          ./scripts/run-supported-python-security-audit.sh
          --python "$(command -v python)"
          --venv-dir "${RUNNER_TEMP}/caliber-security-audit"
          --extras dev
      - name: gitleaks (secrets in repo)
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't upload the SARIF. Nothing consumes it: this workflow has no
          # codeql-action/upload-sarif step and no security-events permission,
          # so the report was written every run and never read. Worse, the
          # action treats an upload failure as fatal, so a clean scan that
          # logged "no leaks found" was still reported as a failed gate when
          # artifact storage was unavailable. The scan's exit code is the
          # signal we actually gate on.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  gate-ledger:
    name: Gate execution ledger
    runs-on: ubuntu-latest
    # ``always()`` because the whole point is to speak up on the runs where
    # something did not happen. Depends on every gate so it observes their final
    # conclusions rather than a snapshot mid-run.
    if: ${{ always() }}
    needs:
      - lint
      - type-check
      - sdk
      - test
      - compatibility
      - integration
      - ui
      - cookbook-ui-only
      - compose
      - package
      - security
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Record which gates actually executed
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_JOB_NAME: Gate execution ledger
        run: python3 .github/scripts/gate_ledger.py
