name: Automated CD validation

on:
  pull_request:
    paths:
      - automated-cd/**
      - .github/workflows/automated-cd.yml
      - .github/workflows/automated-cd-run.yml
  push:
    branches: [main]
    paths:
      - automated-cd/**
      - .github/workflows/automated-cd.yml
      - .github/workflows/automated-cd-run.yml

permissions:
  contents: read

jobs:
  test:
    name: Automated CD tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e './automated-cd[test]'
      - name: Lint and format
        run: |
          ruff check automated-cd/src automated-cd/tests
          ruff format --check automated-cd/src automated-cd/tests
      - name: Test orchestration
        run: python -m pytest automated-cd/tests --cov=autocd --cov-branch --cov-report=term-missing --cov-fail-under=95 -q
      - name: Smoke test isolated Git worktree
        env:
          AUTOCD_REPO_ROOT: ${{ github.workspace }}
          AUTOCD_STATE_DIR: ${{ runner.temp }}/private-autocd-state
          AUTOCD_WORKTREE_DIR: /tmp/autocd-smoke-worktrees-${{ github.run_id }}
          AUTOCD_WORKER_USER: autocdqa
        run: |
          sudo useradd --create-home --shell /bin/bash autocdqa
          mkdir -p "$AUTOCD_STATE_DIR"
          chmod 700 "$AUTOCD_STATE_DIR"
          printf 'private\n' > "$AUTOCD_STATE_DIR/marker"
          path="$GITHUB_WORKSPACE"
          sudo chmod o+rx "$path"
          while [ "$path" != / ]; do
            path=$(dirname "$path")
            sudo chmod o+x "$path"
          done
          sudo -u autocdqa -- test -r "$GITHUB_WORKSPACE/AGENTS.md"
          python - <<'PY'
          from autocd.config import load
          from autocd.github import GitHub
          branch, path = GitHub(load()).prepare_worktree(999999, 'abcdef1234')
          with open('/tmp/autocd-smoke-worktree', 'w') as out:
              out.write(str(path))
          PY
          worktree=$(cat /tmp/autocd-smoke-worktree)
          sudo -E -H -u autocdqa -- env PATH="$PATH" sh -c 'test "$HOME" = /home/autocdqa && test -w "$1" && git -C "$1" diff --check && printf "smoke\n" > "$1/worker-created.txt"' sh "$worktree"
          git -C "$worktree" status --short | grep -q worker-created.txt
          # The coordinator must be able to commit a worker-written candidate on a runner
          # that has no git identity configured; this was never exercised before a real PR.
          git config --get user.email || echo 'Runner has no git identity configured'
          git -C "$worktree" add worker-created.txt
          python - "$worktree" <<'PY'
          import sys
          from pathlib import Path
          from autocd.config import load
          from autocd.github import GitHub
          print('Committed', GitHub(load()).commit(Path(sys.argv[1]), 999999))
          PY
          git -C "$worktree" log -1 --format='%an <%ae>' | grep -q '^Caliber Automated CD <'
          report_dir=$(mktemp -d)
          chmod 733 "$report_dir"
          sudo -E -H -u autocdqa -- env PATH="$PATH" sh -c '
            cd "$1"
            printf "value = 1\n" > smoke_module.py
            printf "import smoke_module\ndef test_smoke(): assert smoke_module.value == 1\n" > test_smoke.py
            python -m pytest test_smoke.py --cov=smoke_module --cov-report=json:"$2" -q
          ' sh "$worktree" "$report_dir/coverage.json"
          python -c 'import json,sys; assert json.load(open(sys.argv[1]))["totals"]["covered_lines"] > 0' "$report_dir/coverage.json"
          if sudo -u autocdqa -- rm "$worktree/.git"; then
            echo 'Worker replaced the Git marker'; exit 1
          fi
          if sudo -u autocdqa -- cat "$AUTOCD_STATE_DIR/marker"; then
            echo 'Worker read private coordinator state'; exit 1
          fi
      - name: Smoke test a large model prompt through the isolated worker
        env:
          AUTOCD_REPO_ROOT: ${{ github.workspace }}
          AUTOCD_STATE_DIR: ${{ runner.temp }}/private-autocd-state
          AUTOCD_WORKTREE_DIR: /tmp/autocd-smoke-worktrees-${{ github.run_id }}
          AUTOCD_WORKER_USER: autocdqa
        run: |
          # Linux rejects any single argument of 128 KiB or more with E2BIG, so a
          # large reviewer diff must reach the CLI on stdin through sudo.
          fakebin=$(mktemp -d /tmp/autocd-fakebin-XXXXXX)
          chmod 755 "$fakebin"
          cat > "$fakebin/claude" <<'SH'
          #!/bin/sh
          bytes=$(wc -c)
          [ "$bytes" -ge 400000 ] || { echo "stdin carried $bytes bytes" >&2; exit 3; }
          printf '%s\n' '{"type":"result","total_cost_usd":0,"result":{"approved":true,"findings":[]}}'
          SH
          chmod 755 "$fakebin/claude"
          PATH="$fakebin:$PATH" python - <<'PY'
          import os, tempfile
          from pathlib import Path
          from autocd.agents import ClaudeAgent
          from autocd.config import load
          settings = load()
          assert settings.worker_user == 'autocdqa', settings.worker_user
          with tempfile.TemporaryDirectory(dir='/tmp') as cwd:
              os.chmod(cwd, 0o755)
              result = ClaudeAgent(settings, lambda *a: None).run('reviewer', 'x' * 400_000, Path(cwd))
          assert result == {'approved': True, 'findings': []}, result
          PY
      - name: Smoke test a large Codex prompt through the isolated worker
        env:
          AUTOCD_REPO_ROOT: ${{ github.workspace }}
          AUTOCD_STATE_DIR: ${{ runner.temp }}/private-autocd-state
          AUTOCD_WORKTREE_DIR: /tmp/autocd-smoke-worktrees-${{ github.run_id }}
          AUTOCD_WORKER_USER: autocdqa
          OPENAI_API_KEY: sk-smoke-not-a-real-key-0000
        run: |
          # The Codex adapter must reach the worker over sudo with the prompt on stdin,
          # a worker-readable output schema, and the key only as CODEX_API_KEY.
          fakebin=$(mktemp -d /tmp/autocd-fakebin-XXXXXX)
          chmod 755 "$fakebin"
          cat > "$fakebin/codex" <<'SH'
          #!/bin/sh
          bytes=$(wc -c)
          [ "$bytes" -ge 400000 ] || { echo "stdin carried $bytes bytes" >&2; exit 3; }
          [ "$(id -un)" = autocdqa ] || { echo "not the worker" >&2; exit 4; }
          [ -n "$CODEX_API_KEY" ] && [ -z "$OPENAI_API_KEY" ] || { echo "key handling" >&2; exit 5; }
          schema=$(printf '%s\n' "$@" | sed -n '/^--output-schema$/{n;p}')
          test -r "$schema" || { echo "schema unreadable" >&2; exit 6; }
          printf '%s\n' '{"type":"item.completed","item":{"type":"agent_message","text":"{\"approved\":true,\"findings\":[]}"}}'
          printf '%s\n' '{"type":"turn.completed","usage":{"input_tokens":10,"cached_input_tokens":0,"output_tokens":5}}'
          SH
          chmod 755 "$fakebin/codex"
          PATH="$fakebin:$PATH" python - <<'PY'
          import os, tempfile
          from dataclasses import replace
          from pathlib import Path
          from autocd.agents import CodexAgent
          from autocd.config import load
          settings = replace(load(), provider='codex_cli')
          assert settings.worker_user == 'autocdqa', settings.worker_user
          with tempfile.TemporaryDirectory(dir='/tmp') as cwd:
              os.chmod(cwd, 0o755)
              result = CodexAgent(settings, lambda *a: None).run('reviewer', 'x' * 400_000, Path(cwd))
          assert result == {'approved': True, 'findings': []}, result
          PY
      - name: Smoke test the real Codex CLI as the isolated worker
        # One tiny live call (well under one cent) proves the hosted path the daily
        # run depends on: Codex install, API-key auth via CODEX_API_KEY, sudo to the
        # worker, the Linux sandbox, and schema-constrained output. Skipped when the
        # secret is unavailable (forks).
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          AUTOCD_REPO_ROOT: ${{ github.workspace }}
          AUTOCD_STATE_DIR: ${{ runner.temp }}/private-autocd-state
          AUTOCD_WORKTREE_DIR: /tmp/autocd-smoke-worktrees-${{ github.run_id }}
          AUTOCD_WORKER_USER: autocdqa
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY unavailable; skipping'; exit 0; }
          # Codex sandboxes model commands with bubblewrap. Use the distribution bwrap
          # with Ubuntu's bwrap-userns-restrict AppArmor profile (OpenAI's documented
          # setup for 24.04): the profile grants user namespaces to bwrap alone, so the
          # system-wide restriction stays on. Without it every sandboxed command fails
          # ("bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted").
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap apparmor-profiles apparmor-utils >/dev/null
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          npm install --global @openai/codex >/dev/null
          codex --version
          work=$(mktemp -d /tmp/autocd-codex-live-XXXXXX)
          chmod 755 "$work"
          printf 'def add(a, b):\n    return a - b\n' > "$work/mod.py"
          chmod 644 "$work/mod.py"
          python - "$work" <<'PY'
          import sys
          from dataclasses import replace
          from pathlib import Path
          from autocd.agents import AgentError, CodexAgent
          from autocd.config import load
          settings = replace(load(), provider='codex_cli', reasoning='low', agent_timeout_seconds=600, stall_seconds=300)
          assert settings.worker_user == 'autocdqa'
          events = []
          agent = CodexAgent(settings, lambda kind, detail: events.append((kind, detail)))
          try:
              result = agent.run(
                  'reviewer',
                  'Run `cat mod.py` in your shell, then review it: add() must return a + b.',
                  Path(sys.argv[1]),
              )
          except AgentError as error:
              print('CODEX FAILED:', error)
              for kind, detail in events:
                  print(kind, str(detail)[:400])
              raise SystemExit(1)
          print('verdict:', result)
          print('usage:', [d for k, d in events if k == 'agent_usage'])
          commands = [d for k, d in events if k == 'agent_progress']
          print('commands:', commands)
          assert isinstance(result.get('approved'), bool) and isinstance(result.get('findings'), list)
          # The model reads files through its shell, so the sandbox must run commands.
          assert commands, 'the model ran no sandboxed command'
          assert 'bwrap' not in str(result), 'the Codex sandbox failed to start'
          assert result['approved'] is False and result['findings'], 'the planted bug was missed'
          PY
      - name: Build and inspect wheel
        run: |
          python -m build automated-cd --outdir /tmp/autocd-dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path('/tmp/autocd-dist').glob('*.whl'))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {f'autocd/prompts/{role}.md' for role in ('planner', 'decision', 'developer', 'reviewer', 'qa')}
          if not required.issubset(names):
              raise SystemExit(f'wheel missing prompts: {sorted(required - names)}')
          PY
