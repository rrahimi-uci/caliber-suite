[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caliber-automated-cd"
version = "0.1.0"
description = "Guarded automated engineering workflow for CALIBER"
requires-python = ">=3.11"
dependencies = ["cryptography>=50.0.1,<51"]

[project.optional-dependencies]
test = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
caliber-autocd = "autocd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autocd = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
