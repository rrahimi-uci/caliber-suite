[workflow]
enabled = true
repository = "rrahimi-uci/caliber-suite"
base_branch = "main"
daily_time = "04:00"
timezone = "America/Los_Angeles"
# 0 means the complete CALIBER Project; a positive number selects one view.
project_view_number = 0
# Counts completed Project Task issues across releases with a merged closing
# PR and Project Done on the configured local day.
daily_done_target = 10
# Maximum new task attempts per Pacific calendar day, including manual runs.
max_tasks_per_run = 10
max_workers = 2
# PRs remain open for owner review; automation never merges them.
auto_merge = false
max_review_cycles = 3
# Extra developer turns per review cycle when coordinator checks fail. The developer
# has no shell, so failing gates go straight back to it before any reviewer call.
max_fix_attempts = 2
# Scheduled runs return a cleanly blocked pre-PR task (no head, PR or remote
# branch; not a developer blocker or scope violation) to Ready on a later Pacific
# day, at most this many times per issue. Zero keeps manual reconciliation only.
max_auto_retries = 2
agent_timeout_seconds = 3600
stall_seconds = 900
# The full changed-code coverage suite can exceed one hour on hosted runners.
qa_command_timeout_seconds = 7200
ci_timeout_seconds = 43200
allow_overlapping_runs = false
# GitHub-hosted runner sets this to an unprivileged account for model and QA work.
worker_user = ""
# Empty means any eligible executable task. Set to issue numbers to restrict unattended work.
issue_allowlist = []

[model]
# codex_cli runs `codex exec` with OPENAI_API_KEY; claude_cli runs Claude Code.
provider = "codex_cli"
name = "gpt-5.6-luna"
# GPT-5.6 Luna accepts none, low, medium, high, xhigh and max.
reasoning = "xhigh"
# Claude Code only: per-call cap; zero lets the daily cap bound each call. Codex
# has no per-call budget flag, so its spend is checked before every call.
max_budget_usd = 0.0
# Pacific-calendar-day cap across planner, developer, reviewer and QA calls.
# Zero disables the aggregate cap.
daily_budget_usd = 30.0
temperature = "default"
max_output_tokens = 0

[model.prices]
# USD per million tokens, used to turn Codex token usage into spend for the daily
# guard. gpt-5.6-luna standard short-context rates (developers.openai.com/api/docs/pricing,
# 2026-11-10); prompts above 272K input tokens bill higher, so the guard is a floor.
input = 0.20
cached_input = 0.02
cache_write = 0.25
output = 1.20

[checks]
# Minimum line-plus-branch coverage (%) of each changed production Python module,
# measured by the backend tests that import it.
coverage_threshold = 85
# Commands run in each isolated task worktree. Add task-specific commands via
# issue_checks below; no command is silently skipped after it is selected.
setup = ["uv venv --seed caliber/.venv --python 3.11", "caliber/.venv/bin/python -m pip --version", "uv pip install --python caliber/.venv/bin/python -e caliber[dev,postgres,ingest,ocr,llm,knowledge,dspy,knowledge-local,memory]"]
base = ["git diff --check", "node .agents/bin/check.mjs", "scripts/ci-local.sh docs-validation lint type-check test-smoke"]
# This repository's gate ledger fails when an applicable required job was
# skipped. Branch protection currently does not enumerate all policy gates.
required = ["Gate execution ledger"]

[issue_checks]
# The verification provenance task adds an Alembic migration, which is outside
# the standard source-path fallback. Full PostgreSQL parity runs in PR CI.
"821" = ["caliber/.venv/bin/python -m pytest caliber/tests/test_routes_verification_queue.py caliber/tests/test_migrations.py --no-cov -q", "scripts/ci-local.sh backend-core"]
# The D5 recovery audit must run its PostgreSQL barrier scenarios. The hosted job provides a
# PostgreSQL service container (CALIBER_CI_LOCAL_POSTGRES_URL) that these jobs use without Docker.
"1144" = ["scripts/ci-local.sh egi-scenarios-postgres migration-parity-postgres"]
# #1181 requires executed (not skipped) PostgreSQL EGI scenario evidence.
"1181" = ["scripts/ci-local.sh egi-scenarios-postgres"]
# "123" = ["python -m pytest path/to/affected/tests -q"]

[issue_paths]
# Only reviewed, disjoint path ownership enables parallel execution.
# "123" = ["caliber/src/caliber/example.py", "caliber/tests/test_example.py"]
