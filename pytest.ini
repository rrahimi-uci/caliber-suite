[pytest]
markers =
    integration: integration tests requiring an MLflow server or other opt-in external dependency
    slow: tests that take >1s or cover slower end-to-end paths
filterwarnings =
    ignore::DeprecationWarning:mlflow.*
    ignore::FutureWarning:mlflow.*
    ignore::UserWarning:mlflow.*
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::DeprecationWarning:dspy.*
    ignore::UserWarning:dspy.*
    ignore:.*swigvarlink has no __module__ attribute.*:DeprecationWarning
